<style>
  :root{
    --navy:#0F2A3D; --navy-2:#153A50; --teal:#1A6E7E; --gold:#D9A544; --gold-2:#C98A2E;
    --paper:#FBF7EE; --panel:#FFFFFF; --ink:#1C1C1C; --ink-soft:#5B6570;
    --line:#E4DECB; --red:#B4402F; --green:#2F7A52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
  .app{display:flex;min-height:100vh;}

  .sidebar{width:235px;flex-shrink:0;background:var(--navy);color:#EDE7D6;padding:22px 16px;display:flex;flex-direction:column;gap:4px;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px 6px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
  .brand-mark{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--gold);font-size:16px;}
  .brand-name{font-weight:600;font-size:14.5px;line-height:1.3;}
  .brand-sub{font-size:10.5px;color:#9FB0B9;letter-spacing:.5px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#D9E1E6;
    transition:background .15s;border:none;background:none;text-align:start;width:100%;font-family:inherit;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--gold);color:var(--navy);font-weight:600;}
  .nav-icon{width:18px;text-align:center;font-size:14px;}
  .sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:10.5px;color:#8FA0AA;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .page-title{font-size:18px;font-weight:600;margin:0;}
  .page-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .select-ctrl{font-family:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
  .content{padding:22px 26px;overflow-y:auto;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden;}
  .kpi::before{content:"";position:absolute;top:0;inset-inline-end:0;width:4px;height:100%;background:var(--accent,var(--teal));}
  .kpi-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
  .kpi-value{font-size:21px;font-weight:700;letter-spacing:-.2px;}
  .kpi-value.pos{color:var(--green);} .kpi-value.neg{color:var(--red);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .panel-title{font-size:14.5px;font-weight:600;margin:0;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:start;padding:9px 8px;color:var(--ink-soft);font-weight:500;border-bottom:1.5px solid var(--line);font-size:11.5px;white-space:nowrap;}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAF8F0;}
  .num{font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;}
  .tag.paid{background:#E4F1E8;color:var(--green);}
  .tag.pending{background:#FBEFE0;color:#A8722C;}
  .tag.collected{background:#E4F1E8;color:var(--green);}
  .tag.admin{background:#E6E0F5;color:#5B3FA0;}
  .tag.employee{background:#E6F0F5;color:var(--teal);}
  .tag.accountant{background:#FFF1DE;color:#A8722C;}

  .btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.88;} .btn:disabled{opacity:.5;cursor:default;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-gold{background:var(--gold);color:var(--navy);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn-sm{padding:5px 11px;font-size:12px;}
  .btn-danger{background:#F7E7E4;color:var(--red);}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);font-family:inherit;font-size:13.5px;background:var(--paper);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  .overlay{position:fixed;inset:0;background:rgba(15,42,61,.45);display:none;align-items:center;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel);border-radius:12px;padding:22px 24px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:16px;}
  .close-x{cursor:pointer;font-size:18px;color:var(--ink-soft);background:none;border:none;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .bar-label{width:130px;font-size:12.5px;flex-shrink:0;}
  .bar-track{flex:1;height:20px;background:#F1EBDB;border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--navy));border-radius:5px;}
  .bar-val{width:110px;text-align:end;font-size:12px;flex-shrink:0;}
  .empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:26px 0;}
  .note{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .section-flex{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,rgba(217,165,68,.08),transparent 60%),var(--navy);}
  .login-card{background:var(--panel);border-radius:16px;padding:34px 32px;width:380px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-mark{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--gold);margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--gold-2);font-size:24px;background:var(--navy);}
  .login-agency-ar{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;text-align:center;}
  .login-agency-en{font-size:10.5px;letter-spacing:1.4px;color:var(--ink-soft);text-align:center;margin-bottom:20px;}
  .login-error{background:#F7E7E4;color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:12px;}
  .login-demo{font-size:11px;color:var(--ink-soft);margin-top:14px;text-align:center;line-height:1.6;}

  .setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px;}
  .setup-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;max-width:560px;}
  .setup-card h2{margin-top:0;color:var(--navy);}
  .setup-card code{background:var(--paper);padding:2px 6px;border-radius:4px;font-size:12.5px;}
  .setup-card pre{background:var(--navy);color:#EDE7D6;padding:14px;border-radius:8px;font-size:12px;overflow-x:auto;direction:ltr;text-align:left;}

  @media (max-width:980px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .grid-2,.grid-3{grid-template-columns:1fr;}
    .sidebar{width:180px;}
    .section-flex{flex-direction:column;}
  }
</style>

let branches = [], users = [], bookings = [], journal = [], manualExpenses = [];
let route = 'dashboard';

async function fetchAll(){
  const [b, u, bk, jr, ex] = await Promise.all([
    sb.from('branches').select('*').order('created_at'),
    sb.from('app_users').select('id,name,username,role,branch_id').order('created_at'),
    sb.from('bookings').select('*').order('created_at', {ascending:false}),
    sb.from('journal').select('*').order('created_at', {ascending:false}),
    sb.from('manual_expenses').select('*').order('created_at', {ascending:false})
  ]);
  if(b.error||u.error||bk.error||jr.error||ex.error) throw (b.error||u.error||bk.error||jr.error||ex.error);
  branches = b.data||[]; users = u.data||[]; bookings = bk.data||[]; journal = jr.data||[]; manualExpenses = ex.data||[];

/* ===================== HELPERS ===================== */
function money(n){ const v=Number(n)||0; return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' SAR'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function branchName(id){ const b = branches.find(x=>x.id===id); return b ? b.name : '—'; }
function currentUser(){ return getSession(); }
function isAdmin(){ const u = currentUser(); return u && u.role==='admin'; }
function isAccountant(){ const u = currentUser(); return u && u.role==='accountant'; }
function canSeeAllBranches(){ return isAdmin() || isAccountant(); }
function effectiveBranchFilter(){
  const u = currentUser();
  if(u && u.role==='employee') return u.branch_id || 'all';
  return branchFilter;
}
function filteredBookings(){
  const bf = effectiveBranchFilter();
  if(bf==='all') return bookings;
  return bookings.filter(b=>b.branch_id===bf);
}

const AIRLINE_HINTS = ['SV','EY','EK','G9','FZ','GF','QR','6E','XY'];

/* ===================== ACCOUNTING ENGINE (Supabase-backed) ===================== */
async function addBooking(data){
  const net = Number(data.net)||0, profit = Number(data.profit)||0;
  const sell = +(net+profit).toFixed(2);
  const row = {
    date: data.date||todayStr(), customer: data.customer, branch_id: data.branchId,
    airline: data.airline, ticket_no: data.ticketNo||null, invoice_no: data.invoiceNo||null,
    is_open_ticket: !!data.isOpenTicket, supplier: data.source,
    sell, cost: net, commission_rate: 0, commission: 0, profit_amount: profit,
    margin: profit, net_profit: profit, payment_status: data.paymentStatus||'pending',
    commission_status:'pending', created_by: currentUser()?.id||null
  };
  const {data:inserted, error} = await sb.from('bookings').insert(row).select().single();
  if(error) throw error;
  bookings.unshift(inserted);
  const jRows = [{ date:inserted.date, branch_id:inserted.branch_id, desc_key:'jSale',
    desc_args:[inserted.booking_no, inserted.airline||'-', inserted.customer],
    debit_key:'accCustomers', credit_key:'accSalesRev', amount: sell }];
  if(net>0) jRows.push({ date:inserted.date, branch_id:inserted.branch_id, desc_key:'jCost',
    desc_args:[inserted.booking_no, inserted.airline||'-'], debit_key:'accCogs', credit_key:'accSuppliers', amount: net });
  const {data:jIns, error:jErr} = await sb.from('journal').insert(jRows).select();
  if(jErr) throw jErr;
  journal.unshift(...jIns.reverse());
}
function journalDesc(j){
  const templates = { jSale:{ar:(a)=>`مبيعات حجز #${a[0]} - ${a[1]} - ${a[2]}`, en:(a)=>`Sale booking #${a[0]} - ${a[1]} - ${a[2]}`},
    jCost:{ar:(a)=>`تكلفة حجز #${a[0]} مستحقة لـ ${a[1]}`, en:(a)=>`Cost of booking #${a[0]} payable to ${a[1]}`},
    jComm:{ar:(a)=>`عمولة مستحقة من ${a[0]} - حجز #${a[1]}`, en:(a)=>`Commission receivable from ${a[0]} - booking #${a[1]}`},
    jExpense:{ar:(a)=>`مصروف: ${a[0]}`, en:(a)=>`Expense: ${a[0]}`},
    jCollectComm:{ar:(a)=>`تحصيل عمولة حجز #${a[0]} من ${a[1]}`, en:(a)=>`Collected commission for booking #${a[0]} from ${a[1]}`} };
  const tpl = templates[j.desc_key];
  return tpl ? tpl[lang](j.desc_args||[]) : '';
}
async function collectCommission(bookingId){
  const b = bookings.find(x=>x.id===bookingId);
  if(!b || b.commission_status==='collected') return;
  const {error} = await sb.from('bookings').update({commission_status:'collected'}).eq('id', bookingId);
  if(error) throw error;
  b.commission_status = 'collected';
  const {data:jIns, error:jErr} = await sb.from('journal').insert({ date:todayStr(), branch_id:b.branch_id,
    desc_key:'jCollectComm', desc_args:[b.booking_no, b.supplier], debit_key:'accCash', credit_key:'accCommRec', amount:b.commission }).select().single();
  if(jErr) throw jErr;
  journal.unshift(jIns);
}
async function markPaid(bookingId){
  const {error} = await sb.from('bookings').update({payment_status:'paid'}).eq('id', bookingId);
  if(error) throw error;
  const b = bookings.find(x=>x.id===bookingId); if(b) b.payment_status='paid';
}
async function addManualExpense(data){
  const amount = Number(data.amount)||0;
  const {data:ins, error} = await sb.from('manual_expenses').insert({ date:data.date||todayStr(), branch_id:data.branchId, description:data.desc, amount }).select().single();
  if(error) throw error;
  manualExpenses.unshift(ins);
  const {data:jIns, error:jErr} = await sb.from('journal').insert({ date:ins.date, branch_id:ins.branch_id,
    desc_key:'jExpense', desc_args:[data.desc], debit_key:'accExpenses', credit_key:'accCash', amount }).select().single();
  if(jErr) throw jErr;
  journal.unshift(jIns);
}
function computeTotals(bookingsList, expensesList){
  const sales = bookingsList.reduce((s,b)=>s+Number(b.sell),0);
  const cost = bookingsList.reduce((s,b)=>s+Number(b.cost),0);
  const commission = bookingsList.reduce((s,b)=>s+Number(b.commission),0);
  const expenses = expensesList.reduce((s,e)=>s+Number(e.amount),0);
  const revenue = sales+commission;
  const netProfit = sales-cost+commission-expenses;
  const pendingCommission = bookingsList.filter(b=>b.commission_status==='pending').reduce((s,b)=>s+Number(b.commission),0);
  return {sales,cost,commission,expenses,revenue,netProfit,pendingCommission,count:bookingsList.length};
}
function expensesForFilter(){
  const bf = effectiveBranchFilter();
  return bf==='all' ? manualExpenses : manualExpenses.filter(e=>e.branch_id===bf);
}

function branchBarsHTML(metric){
  const rows = branches.map(b=>{
    const bl = bookings.filter(x=>x.branch_id===b.id);
    const tt = computeTotals(bl, manualExpenses.filter(e=>e.branch_id===b.id));
    return {name:b.name, val: metric==='sales'?tt.sales:tt.netProfit};
  });
  const max = Math.max(1, ...rows.map(r=>r.val));
  if(rows.length===0) return `<div class="empty">${t('emptyBranches')}</div>`;
  return rows.map(r=>`<div class="bar-row"><div class="bar-label">${r.name}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,(r.val/max*100))}%"></div></div>
    <div class="bar-val num">${money(r.val)}</div></div>`).join('');
}

  const tt = computeTotals(list, expList);
  const bf = effectiveBranchFilter();
  const jrnl = bf==='all' ? journal : journal.filter(j=>j.branch_id===bf);
  document.getElementById('content').innerHTML = `
    <div class="section-flex">
      <div class="panel" style="flex:1"><div class="panel-head"><h3 class="panel-title">${t('incomeStatement')}</h3></div>
        <table><tbody>
          <tr><td>${t('incomeSales')}</td><td class="num">${money(tt.sales)}</td></tr>
          <tr><td>${t('incomeComm')}</td><td class="num">${money(tt.commission)}</td></tr>
          <tr><td>${t('expenseCost')}</td><td class="num neg">${money(tt.cost)}</td></tr>
          <tr><td>${t('expenseOp')}</td><td class="num neg">${money(tt.expenses)}</td></tr>
          <tr style="border-top:2px solid var(--navy);font-weight:700;"><td>${t('netProfit')}</td><td class="num ${tt.netProfit>=0?'pos':'neg'}">${money(tt.netProfit)}</td></tr>
        </tbody></table>
      </div>
      <div class="panel" style="flex:1"><div class="panel-head"><h3 class="panel-title">${t('chartOfAccounts')}</h3></div>
        <table><tbody>${['accCash','accCustomers','accCommRec','accSuppliers','accSalesRev','accCommRev','accCogs','accExpenses'].map(k=>`<tr><td>${t(k)}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3 class="panel-title">${t('journalTitle')}</h3><button class="btn btn-ghost btn-sm" id="addExpenseBtn">${t('addExpense')}</button></div>
      ${jrnl.length===0?`<div class="empty">${t('journalEmpty')}</div>`:`<div style="overflow-x:auto;"><table>
        <thead><tr><th>${t('jDate')}</th><th>${t('jBranch')}</th><th>${t('jDesc')}</th><th>${t('jDebit')}</th><th>${t('jCredit')}</th><th>${t('jAmount')}</th></tr></thead>
        <tbody>${jrnl.slice(0,40).map(j=>`<tr><td class="num">${j.date}</td><td>${branchName(j.branch_id)}</td><td>${journalDesc(j)}</td>
          <td>${t(j.debit_key||'')}</td><td>${t(j.credit_key||'')}</td><td class="num">${money(j.amount)}</td></tr>`).join('')}</tbody>
      </table></div>`}
      ${jrnl.length>40?`<div class="note">${t('journalShowing')} ${jrnl.length}</div>`:''}
    </div>`;
  document.getElementById('addExpenseBtn').onclick = openExpenseModal;
}
function openExpenseModal(){
  const u = currentUser();
  const branchOptions = (u.role==='employee') ? branches.filter(b=>b.id===u.branch_id) : branches;
  showModal(`
    <div class="modal-head"><h3>${t('modalExpense')}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <form id="expenseForm">
      <div class="field"><label>${t('fieldBranch')}</label><select name="branchId">${branchOptions.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select></div>
      <div class="field"><label>${t('fieldExpenseDesc')}</label><input name="desc" required></div>
      <div class="grid-2">
        <div class="field"><label>${t('fieldAmount')}</label><input type="number" step="0.01" name="amount" required></div>
        <div class="field"><label>${t('fieldDate')}</label><input type="date" name="date" value="${todayStr()}"></div>
      </div>
      <div id="expenseErrorBox"></div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:start;">
        <button type="submit" class="btn btn-primary" id="expenseSaveBtn">${t('save')}</button>
        <button type="button" class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      </div>
    </form>`);
  document.getElementById('expenseForm').onsubmit = async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('expenseSaveBtn'); btn.disabled=true; btn.textContent=t('saving');
    const f = new FormData(e.target);
    try{
      await addManualExpense({branchId:f.get('branchId'), desc:f.get('desc'), amount:f.get('amount'), date:f.get('date')});
      closeModal(); render();
    }catch(err){ document.getElementById('expenseErrorBox').innerHTML = `<div class="login-error">${t('connError')}</div>`; btn.disabled=false; btn.textContent=t('save'); }
  };
}

/* ===================== COMMISSIONS ===================== */
function renderCommissions(){
  document.getElementById('pageSub').textContent = t('subCommissions');
  const list = filteredBookings().filter(b=>b.commission>0);
  const bySupplier = {};
  list.forEach(b=>{ bySupplier[b.supplier] = bySupplier[b.supplier] || {pending:0,collected:0,count:0}; bySupplier[b.supplier][b.commission_status]+=Number(b.commission); bySupplier[b.supplier].count++; });
  document.getElementById('content').innerHTML = `
    <div class="panel"><div class="panel-head"><h3 class="panel-title">${t('commBySupplier')}</h3></div>
      ${Object.keys(bySupplier).length===0?`<div class="empty">${t('emptyData')}</div>`:`
      <table><thead><tr><th>${t('colSupplierName')}</th><th>${t('colCount')}</th><th>${t('colPending')}</th><th>${t('colCollected')}</th><th>${t('colTotal')}</th></tr></thead>
        <tbody>${Object.entries(bySupplier).map(([sup,v])=>`<tr><td>${sup}</td><td class="num">${v.count}</td><td class="num">${money(v.pending)}</td><td class="num">${money(v.collected)}</td><td class="num" style="font-weight:600">${money(v.pending+v.collected)}</td></tr>`).join('')}</tbody></table>`}
    </div>
    <div class="panel"><div class="panel-head"><h3 class="panel-title">${t('commDetails')}</h3></div>
      ${list.length===0?`<div class="empty">${t('emptyData')}</div>`:`<div style="overflow-x:auto;">
      <table><thead><tr><th>${t('colBookingNo')}</th><th>${t('colSupplierName')}</th><th>${t('colCustomer')}</th><th>${t('colBranch')}</th><th>${t('colCommAmount')}</th><th>${t('colStatus')}</th><th></th></tr></thead>
        <tbody>${list.map(b=>`<tr><td class="num">${b.booking_no}</td><td>${b.supplier}</td><td>${b.customer}</td><td>${branchName(b.branch_id)}</td>
          <td class="num">${money(b.commission)}</td><td><span class="tag ${b.commission_status}">${b.commission_status==='collected'?t('statusCollected'):t('statusPending')}</span></td>
          <td>${b.commission_status==='pending'?`<button class="btn btn-ghost btn-sm" onclick="uiCollectCommission('${b.id}')">${t('collectComm')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
    </div>`;
}

/* ===================== REPORTS ===================== */
function renderReports(){
  document.getElementById('pageSub').textContent = t('subReports');
  const rows = branches.map(b=>{
    const bl = bookings.filter(x=>x.branch_id===b.id);
    const tt = computeTotals(bl, manualExpenses.filter(e=>e.branch_id===b.id));
    const margin = tt.revenue>0 ? (tt.netProfit/tt.revenue*100) : 0;
    return {name:b.name, ...tt, margin};
  });
  document.getElementById('content').innerHTML = `
    <div class="panel"><div class="panel-head"><h3 class="panel-title">${t('salesByBranch')}</h3></div>${branchBarsHTML('sales')}</div>
    <div class="panel"><div class="panel-head"><h3 class="panel-title">${t('profitByBranch')}</h3></div>${branchBarsHTML('profit')}</div>
    <div class="panel"><div class="panel-head"><h3 class="panel-title">${t('branchTable')}</h3></div>
      ${rows.length===0?`<div class="empty">${t('emptyBranches')}</div>`:`<div style="overflow-x:auto;">
      <table><thead><tr><th>${t('colBranchName')}</th><th>${t('colBookCount')}</th><th>${t('colSalesTotal')}</th><th>${t('colCostTotal')}</th><th>${t('colCommTotal')}</th><th>${t('colExpTotal')}</th><th>${t('colNetProfitCol')}</th><th>${t('colMargin')}</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r.name}</td><td class="num">${r.count}</td><td class="num">${money(r.sales)}</td><td class="num">${money(r.cost)}</td>
          <td class="num">${money(r.commission)}</td><td class="num">${money(r.expenses)}</td><td class="num ${r.netProfit>=0?'pos':'neg'}" style="font-weight:600">${money(r.netProfit)}</td><td class="num">${r.margin.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`}
    </div>`;
}

/* ===================== USERS ===================== */
function renderUsers(){
  document.getElementById('pageSub').textContent = t('subUsers');
  document.getElementById('content').innerHTML = `
    <div class="panel"><div class="panel-head"><h3 class="panel-title">${t('usersTitle')}</h3><button class="btn btn-primary btn-sm" id="addUserBtn">${t('addUser')}</button></div>
      <table><thead><tr><th>${t('colUserName')}</th><th>${t('colUsername')}</th><th>${t('colRole')}</th><th>${t('colUserBranch')}</th><th></th></tr></thead>
        <tbody>${users.map(u=>`<tr><td>${u.name}</td><td class="num">${u.username}</td>
          <td><span class="tag ${u.role}">${u.role==='admin'?t('roleAdmin'):u.role==='accountant'?t('roleAccountant'):t('roleEmployee')}</span></td>
          <td>${u.branch_id?branchName(u.branch_id):'—'}</td>
          <td>${u.id!==currentUser().id?`<button class="btn btn-danger btn-sm" onclick="uiDeleteUser('${u.id}')">${t('delete')}</button>`:''}</td></tr>`).join('')}</tbody></table>
    </div>`;
  document.getElementById('addUserBtn').onclick = openUserModal;
}
function openUserModal(){
  showModal(`
    <div class="modal-head"><h3>${t('modalNewUser')}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <form id="userForm">
      <div class="field"><label>${t('fieldFullName')}</label><input name="name" required></div>
      <div class="grid-2">
        <div class="field"><label>${t('fieldUsername')}</label><input name="username" required></div>
        <div class="field"><label>${t('fieldPassword')}</label><input name="password" required></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>${t('fieldRole')}</label><select name="role"><option value="employee">${t('roleEmployee')}</option><option value="accountant">${t('roleAccountant')}</option><option value="admin">${t('roleAdmin')}</option></select></div>
        <div class="field"><label>${t('fieldUserBranch')}</label><select name="branchId"><option value="">${t('noBranch')}</option>${branches.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select></div>
      </div>
      <div id="userErrorBox"></div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:start;">
        <button type="submit" class="btn btn-primary" id="userSaveBtn">${t('add')}</button>
        <button type="button" class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      </div>
    </form>`);
  document.getElementById('userForm').onsubmit = async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('userSaveBtn'); btn.disabled=true; btn.textContent=t('saving');
    const f = new FormData(e.target);
    const username = (f.get('username')||'').trim();
    const role = f.get('role');
    const branchId = f.get('branchId')||null;
    try{
      const {data:newId, error} = await sb.rpc('create_app_user', { p_name:f.get('name'), p_username:username, p_password:f.get('password'), p_role:role, p_branch_id: role==='employee'?branchId:null });
      if(error){
        if(String(error.message||'').toLowerCase().includes('duplicate')){ document.getElementById('userErrorBox').innerHTML = `<div class="login-error">${t('usernameTaken')}</div>`; btn.disabled=false; btn.textContent=t('add'); return; }
        throw error;
      }
      users.push({ id:newId, name:f.get('name'), username, role, branch_id: role==='employee'?branchId:null });
      closeModal(); render();
    }catch(err){ console.error(err); document.getElementById('userErrorBox').innerHTML = `<div class="login-error">${t('connError')}</div>`; btn.disabled=false; btn.textContent=t('add'); }
  };
}
window.uiDeleteUser = async function(id){
  if(id===currentUser().id){ alert(t('cannotDeleteSelf')); return; }
  try{ const {error} = await sb.from('app_users').delete().eq('id', id); if(error) throw error; users = users.filter(u=>u.id!==id); render(); }
  catch(e){ alert(t('connError')); }
};

/* ===================== SETTINGS ===================== */
function renderSettings(){
  document.getElementById('pageSub').textContent = t('subSettings');
  document.getElementById('content').innerHTML = `
    <div class="panel"><div class="panel-head"><h3 class="panel-title">${t('branchesTitle')}</h3><button class="btn btn-primary btn-sm" id="addBranchBtn">${t('addBranch')}</button></div>
      <table><thead><tr><th>${t('colBranchOnly')}</th><th></th></tr></thead>
        <tbody>${branches.map(b=>`<tr><td>${b.name}</td><td><button class="btn btn-danger btn-sm" onclick="uiRemoveBranch('${b.id}')">${t('delete')}</button></td></tr>`).join('')}</tbody></table>
      <div class="note">${t('branchDeleteNote')}</div>
    </div>
    <div class="panel"><div class="panel-head"><h3 class="panel-title">${t('resetTitle')}</h3></div><p class="note">${t('resetNote')}</p></div>`;
  document.getElementById('addBranchBtn').onclick = ()=>{
    showModal(`
      <div class="modal-head"><h3>${t('modalNewBranch')}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <form id="branchForm">
        <div class="field"><label>${t('fieldBranchName')}</label><input name="name" required></div>
        <div id="branchErrorBox"></div>
        <div style="margin-top:16px;display:flex;gap:10px;justify-content:start;">
          <button type="submit" class="btn btn-primary" id="branchSaveBtn">${t('add')}</button>
          <button type="button" class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
        </div>
      </form>`);
    document.getElementById('branchForm').onsubmit = async (e)=>{
      e.preventDefault();
      const btn = document.getElementById('branchSaveBtn'); btn.disabled=true; btn.textContent=t('saving');
      const f = new FormData(e.target);
      try{
        const {data:ins, error} = await sb.from('branches').insert({name:f.get('name')}).select().single();
        if(error) throw error;
        branches.push(ins); closeModal(); render();
      }catch(err){ document.getElementById('branchErrorBox').innerHTML = `<div class="login-error">${t('connError')}</div>`; btn.disabled=false; btn.textContent=t('add'); }
    };
  };
}
window.uiRemoveBranch = async function(id){
  try{
    const {error} = await sb.from('branches').delete().eq('id', id);
    if(error) throw error;
    branches = branches.filter(b=>b.id!==id);
    if(branchFilter===id) branchFilter='all';
    render();
  }catch(e){ alert(t('branchDeleteError')); }
};

/* ===================== MODAL ===================== */
function showModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('overlay').classList.add('show'); }
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
window.closeModal = closeModal;
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

/* ===================== INIT ===================== */
boot();
</script>
</body>
</html>
