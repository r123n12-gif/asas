<style>
  :root{
    --navy:#0F2A3D; --navy-2:#153A50; --teal:#1A6E7E; --gold:#D9A544; --gold-2:#C98A2E;
    --paper:#FBF7EE; --panel:#FFFFFF; --ink:#1C1C1C; --ink-soft:#5B6570;
    --line:#E4DECB; --red:#B4402F; --green:#2F7A52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
  .app{display:flex;min-height:100vh;}

  .sidebar{width:235px;flex-shrink:0;background:var(--navy);color:#EDE7D6;padding:22px 16px;display:flex;flex-direction:column;gap:4px;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px 6px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
  .brand-mark{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--gold);font-size:16px;}
  .brand-name{font-weight:600;font-size:14.5px;line-height:1.3;}
  .brand-sub{font-size:10.5px;color:#9FB0B9;letter-spacing:.5px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#D9E1E6;
    transition:background .15s;border:none;background:none;text-align:start;width:100%;font-family:inherit;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--gold);color:var(--navy);font-weight:600;}
  .nav-icon{width:18px;text-align:center;font-size:14px;}
  .sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:10.5px;color:#8FA0AA;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .page-title{font-size:18px;font-weight:600;margin:0;}
  .page-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .select-ctrl{font-family:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
  .content{padding:22px 26px;overflow-y:auto;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden;}
  .kpi::before{content:"";position:absolute;top:0;inset-inline-end:0;width:4px;height:100%;background:var(--accent,var(--teal));}
  .kpi-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
  .kpi-value{font-size:21px;font-weight:700;letter-spacing:-.2px;}
  .kpi-value.pos{color:var(--green);} .kpi-value.neg{color:var(--red);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .panel-title{font-size:14.5px;font-weight:600;margin:0;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:start;padding:9px 8px;color:var(--ink-soft);font-weight:500;border-bottom:1.5px solid var(--line);font-size:11.5px;white-space:nowrap;}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAF8F0;}
  .num{font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;}
  .tag.paid{background:#E4F1E8;color:var(--green);}
  .tag.pending{background:#FBEFE0;color:#A8722C;}
  .tag.collected{background:#E4F1E8;color:var(--green);}
  .tag.admin{background:#E6E0F5;color:#5B3FA0;}
  .tag.employee{background:#E6F0F5;color:var(--teal);}
  .tag.accountant{background:#FFF1DE;color:#A8722C;}
  .tag.rejected{background:#F7E7E4;color:var(--red);}

  .btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.88;} .btn:disabled{opacity:.5;cursor:default;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-gold{background:var(--gold);color:var(--navy);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn-sm{padding:5px 11px;font-size:12px;}
  .btn-danger{background:#F7E7E4;color:var(--red);}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);font-family:inherit;font-size:13.5px;background:var(--paper);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  .overlay{position:fixed;inset:0;background:rgba(15,42,61,.45);display:none;align-items:center;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel);border-radius:12px;padding:22px 24px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:16px;}
  .close-x{cursor:pointer;font-size:18px;color:var(--ink-soft);background:none;border:none;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .bar-label{width:130px;font-size:12.5px;flex-shrink:0;}
  .bar-track{flex:1;height:20px;background:#F1EBDB;border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--navy));border-radius:5px;}
  .bar-val{width:110px;text-align:end;font-size:12px;flex-shrink:0;}
  .empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:26px 0;}
  .note{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .section-flex{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,rgba(217,165,68,.08),transparent 60%),var(--navy);}
  .login-card{background:var(--panel);border-radius:16px;padding:34px 32px;width:380px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-mark{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--gold);margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--gold-2);font-size:24px;background:var(--navy);}
  .login-agency-ar{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;text-align:center;}
  .login-agency-en{font-size:10.5px;letter-spacing:1.4px;color:var(--ink-soft);text-align:center;margin-bottom:20px;}
  .login-error{background:#F7E7E4;color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:12px;}
  .login-demo{font-size:11px;color:var(--ink-soft);margin-top:14px;text-align:center;line-height:1.6;}

  .setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px;}
  .setup-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;max-width:560px;}
  .setup-card h2{margin-top:0;color:var(--navy);}
  .setup-card code{background:var(--paper);padding:2px 6px;border-radius:4px;font-size:12.5px;}
  .setup-card pre{background:var(--navy);color:#EDE7D6;padding:14px;border-radius:8px;font-size:12px;overflow-x:auto;direction:ltr;text-align:left;}

  @media (max-width:980px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .grid-2,.grid-3{grid-template-columns:1fr;}
    .sidebar{width:180px;}
    .section-flex{flex-direction:column;}
  }
</style>

/* ===================== LOCAL CACHE ===================== */
let branches = [], users = [], bookings = [], journal = [], manualExpenses = [], deposits = [], profitHandovers = [];
let route = 'dashboard';
let branchFilter = 'all';

async function fetchAll(){
  const [b, u, bk, jr, ex, dp, ph] = await Promise.all([
    sb.from('branches').select('*').order('created_at'),
    sb.from('app_users').select('id,name,username,role,branch_id').order('created_at'),
    sb.from('bookings').select('*').order('created_at', {ascending:false}),
    sb.from('journal').select('*').order('created_at', {ascending:false}),
    sb.from('manual_expenses').select('*').order('created_at', {ascending:false}),
    sb.from('cash_deposits').select('*').order('created_at', {ascending:false}),
    sb.from('profit_handovers').select('*').order('created_at', {ascending:false})
  ]);
  if(b.error||u.error||bk.error||jr.error||ex.error||dp.error||ph.error) throw (b.error||u.error||bk.error||jr.error||ex.error||dp.error||ph.error);
  branches = b.data||[]; users = u.data||[]; bookings = bk.data||[]; journal = jr.data||[]; manualExpenses = ex.data||[]; deposits = dp.data||[]; profitHandovers = ph.data||[];
}
/* ===================== CASH DEPOSITS ===================== */
function branchCashOnHand(branchId){
  const collectedCash = bookings.filter(b=>b.branch_id===branchId && b.payment_method==='cash').reduce((s,b)=>s+Number(b.sell||0),0);
  const approvedDeposits = deposits.filter(d=>d.branch_id===branchId && d.status==='approved').reduce((s,d)=>s+Number(d.amount||0),0);
  const approvedHandoverIds = new Set();
  profitHandovers.filter(h=>h.status==='approved' && h.branch_id===branchId).forEach(h=>(h.booking_ids||[]).forEach(id=>approvedHandoverIds.add(id)));

async function verifyPaymentReceived(bookingId, actualAmount){
  const b = bookings.find(x=>x.id===bookingId);
  if(!b) return;
  let sell = Number(b.sell)||0;
  if(actualAmount!==undefined && actualAmount!==null && !isNaN(actualAmount) && +actualAmount!==sell){
    const newSell = +Number(actualAmount).toFixed(2);
    const newProfit = b.cost_reviewed ? +(newSell-Number(b.cost||0)).toFixed(2) : b.profit_amount;
    const {error:eSell} = await sb.from('bookings').update({sell:newSell, profit_amount:newProfit, margin:newProfit, net_profit:newProfit}).eq('id', bookingId);
    if(eSell) throw eSell;
    b.sell = newSell; b.profit_amount = newProfit; b.margin = newProfit; b.net_profit = newProfit;
    sell = newSell;
    const existingSale = journal.find(j=>j.booking_id===bookingId && j.desc_key==='jSale');
    if(existingSale){
      const {data:uSale, error:eSaleJ} = await sb.from('journal').update({amount:newSell}).eq('id', existingSale.id).select().single();
      if(eSaleJ) throw eSaleJ;
      const idx = journal.findIndex(j=>j.id===existingSale.id); if(idx>-1) journal[idx]=uSale;
    }
  }
  const isSpan = b.payment_method==='span';
  const isInstallment = b.payment_method==='installment';
  const feeRate = isSpan ? 0.008 : isInstallment ? 0.07 : 0;
  const feeAmount = feeRate>0 ? +(sell*feeRate).toFixed(2) : 0;
  const netToBank = +(sell-feeAmount).toFixed(2);
  const {error} = await sb.from('bookings').update({transfer_verified:true, transfer_verified_by:currentUser()?.id||null, transfer_verified_at:new Date().toISOString(), payment_status:'paid'}).eq('id', bookingId);
  if(error) throw error;
  b.transfer_verified = true; b.payment_status='paid';
  const jRows = [{ date:todayStr(), branch_id:b.branch_id, booking_id:b.id,
    desc_key:'jBankReceipt', desc_args:[b.booking_no, b.customer], debit_key:'accBank', credit_key:'accCustomers', amount:netToBank }];
  if(feeAmount>0) jRows.push({ date:todayStr(), branch_id:b.branch_id, booking_id:b.id,
    desc_key:'jCardFee', desc_args:[b.booking_no], debit_key:'accExpenses', credit_key:'accCustomers', amount:feeAmount });
  const {data:jIns, error:jErr} = await sb.from('journal').insert(jRows).select();
  if(jErr) throw jErr;
  journal.unshift(...jIns.reverse());
}

  list.forEach(b=>{
    if(!b.supplier || !(Number(b.cost)>0)) return;
    if(!map[b.supplier]) map[b.supplier] = {owed:0, settled:0};
    if(b.supplier_settled) map[b.supplier].settled += Number(b.cost)||0;

  return map;

async function addManualExpense(data){
  const amount = Number(data.amount)||0;
  const {data:ins, error} = await sb.from('manual_expenses').insert({ date:data.date||todayStr(), branch_id:data.branchId, description:data.desc, amount }).select().single();
  if(error) throw error;
  manualExpenses.unshift(ins);
  const {data:jIns, error:jErr} = await sb.from('journal').insert({ date:ins.date, branch_id:ins.branch_id,
    desc_key:'jExpense', desc_args:[data.desc], debit_key:'accExpenses', credit_key:'accCashOnHand', amount }).select().single();
  if(jErr) throw jErr;
  journal.unshift(jIns);
}
async function addManualJournalEntry(data){
  const amount = Number(data.amount)||0;
  const {data:jIns, error} = await sb.from('journal').insert({ date:data.date||todayStr(), branch_id:data.branchId,
    desc_key:'jManual', desc_args:[data.desc], debit_key:data.debitKey, credit_key:data.creditKey, amount }).select().single();
  if(error) throw error;
  journal.unshift(jIns);
}
function computeTotals(bookingsList, expensesList){
  const active = bookingsList.filter(b=>!b.refunded);
  const sales = active.reduce((s,b)=>s+Number(b.sell),0);
  const reviewed = active.filter(b=>b.cost_reviewed);
  const pendingReview = active.filter(b=>!b.cost_reviewed);
  const cost = reviewed.reduce((s,b)=>s+Number(b.cost),0);
  const commission = active.reduce((s,b)=>s+Number(b.commission),0);
  const expenses = expensesList.reduce((s,e)=>s+Number(e.amount),0);
  const revenue = sales+commission;
  const reviewedProfit = reviewed.reduce((s,b)=>s+Number(b.profit_amount||0),0);
  const netProfit = reviewedProfit+commission-expenses;
  const pendingReviewSales = pendingReview.reduce((s,b)=>s+Number(b.sell),0);
  const pendingCommission = active.filter(b=>b.commission_status==='pending').reduce((s,b)=>s+Number(b.commission),0);
  return {sales,cost,commission,expenses,revenue,netProfit,pendingCommission,pendingReviewCount:pendingReview.length,pendingReviewSales,count:active.length};
}
function expensesForFilter(){
  const bf = effectiveBranchFilter();
  return bf==='all' ? manualExpenses : manualExpenses.filter(e=>e.branch_id===bf);
}

function branchBarsHTML(metric){
  const rows = branches.map(b=>{
    const bl = bookings.filter(x=>x.branch_id===b.id);

    return {name:b.name, val: metric==='sales'?tt.sales:tt.netProfit};
  });
  const max = Math.max(1, ...rows.map(r=>r.val));
  if(rows.length===0) return `<div class="empty">${t('emptyBranches')}</div>`;
  return rows.map(r=>`<div class="bar-row"><div class="bar-label">${r.name}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,(r.val/max*100))}%"></div></div>
    <div class="bar-val num">${money(r.val)}</div></div>`).join('');
}

function generateBranchReport(branchId, employeeId, dateFrom, dateTo){
  const inRange = (d)=> (!dateFrom || d>=dateFrom) && (!dateTo || d<=dateTo);
  const baseBookings = bookings.filter(b=> (employeeId==='all'||b.created_by===employeeId) && inRange(b.date||''));
  const periodLabel = (dateFrom||dateTo) ? `${dateFrom||'…'} → ${dateTo||'…'}` : t('reportAllPeriod');
  const employeeLabel = employeeId==='all' ? t('allEmployeesOpt') : userName(employeeId);
  let bodyHtml = '';
  let docTitleScope = '';
  if(branchId==='all'){
    docTitleScope = t('allBranches');
    const grandList = baseBookings.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const grandExp = manualExpenses.filter(e=>inRange(e.date||''));
    branches.forEach(br=>{
      const list = baseBookings.filter(b=>b.branch_id===br.id).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      const exp = manualExpenses.filter(e=>e.branch_id===br.id && inRange(e.date||''));
      if(list.length===0 && exp.length===0) return;
      const tt = computeTotals(list, exp);
      bodyHtml += `<h2 style="border-bottom:2px solid #0F2A3D;padding-bottom:4px;">${br.name}</h2>${totalsKpisHTML(tt)}${bookingsTableHTML(list)}<div style="height:14px;"></div>`;
    });
    const grandTt = computeTotals(grandList, grandExp);
    bodyHtml += `<h2 style="margin-top:26px;">${t('grandTotalTitle')}</h2>${totalsKpisHTML(grandTt)}`;
  }else{
    docTitleScope = branchName(branchId);
    const list = baseBookings.filter(b=>b.branch_id===branchId).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const exp = manualExpenses.filter(e=>e.branch_id===branchId && inRange(e.date||''));
    const tt = computeTotals(list, exp);
    bodyHtml = `<h2>${t('reportTotalsTitle')}</h2>${totalsKpisHTML(tt)}<h2>${t('reportBookingsTitle')}</h2>${bookingsTableHTML(list)}`;
  }
  const html = `<!DOCTYPE html><html lang="${lang}" dir="${lang==='ar'?'rtl':'ltr'}"><head><meta charset="UTF-8">
    <title>${t('reportTitle')} — ${docTitleScope}</title>
    <style>
      body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1C1C1C;padding:24px;}
      h1{font-size:19px;margin:0 0 2px;} .sub{color:#5B6570;font-size:12px;margin-bottom:18px;}
      .meta{display:flex;gap:24px;flex-wrap:wrap;font-size:12.5px;margin-bottom:18px;background:#FBF7EE;padding:10px 14px;border-radius:8px;}
      .meta b{display:block;font-size:11px;color:#5B6570;font-weight:500;margin-bottom:2px;}
      .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
      .kpi{border:1px solid #E4DECB;border-radius:8px;padding:10px 14px;min-width:130px;}
      .kpi div:first-child{font-size:11px;color:#5B6570;margin-bottom:4px;}
      .kpi div:last-child{font-size:16px;font-weight:700;}
      table{width:100%;border-collapse:collapse;font-size:11px;}
      th{background:#0F2A3D;color:#fff;padding:7px 6px;text-align:${lang==='ar'?'right':'left'};white-space:nowrap;}
      td{padding:6px;border-bottom:1px solid #E4DECB;}
      h2{font-size:14px;margin:22px 0 8px;}
      @media print{ body{padding:6px;} h2{page-break-after:avoid;} table{page-break-inside:auto;} tr{page-break-inside:avoid;} }
    </style></head><body>
    <h1>${t('agencyAr')} — ${t('reportTitle')}</h1>
    <div class="sub">${t('agencyEn')}</div>
    <div class="meta">
      <div><b>${t('reportBranchLabel')}</b>${docTitleScope}</div>
      <div><b>${t('reportEmployeeLabel')}</b>${employeeLabel}</div>
      <div><b>${t('reportPeriodLabel')}</b>${periodLabel}</div>
      <div><b>${t('reportGenOn')}</b>${new Date().toLocaleString(lang==='ar'?'ar-SA':'en-US')}</div>
    </div>
    ${bodyHtml}
    </body></html>`;
  const w = window.open('', '_blank');
  if(!w){ alert(t('connError')); return; }
  w.document.open(); w.document.write(html); w.document.close();
  w.onload = ()=>{ w.focus(); w.print(); };
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 400);
}

const ACCOUNT_NORMAL_SIDE = { accCashOnHand:'debit', accBank:'debit', accCustomers:'debit', accCommRec:'debit',
  accSuppliers:'credit', accSalesRev:'credit', accCommRev:'credit', accCogs:'debit', accExpenses:'debit' };
function accountBalance(key, jrnl){
  let debit=0, credit=0;
  jrnl.forEach(j=>{ if(j.debit_key===key) debit+=Number(j.amount)||0; if(j.credit_key===key) credit+=Number(j.amount)||0; });
  return ACCOUNT_NORMAL_SIDE[key]==='credit' ? +(credit-debit).toFixed(2) : +(debit-credit).toFixed(2);
}

function openSupplierPaymentModal(){
  const unsettled = bookings.filter(b=>b.supplier && Number(b.cost)>0 && !b.supplier_settled);
  const suppliers = [...new Set(unsettled.map(b=>b.supplier))];
  showModal(`

    ${suppliers.length===0?`<div class="empty">${t('noUnsettledSupplier')}</div>`:`

      ${suppliers.map(s=>`<option value="${s}">${s}</option>`).join('')}

      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>

  `);
  if(suppliers.length===0) return;
  const renderList = (supplierName)=>{
    const list = unsettled.filter(b=>b.supplier===supplierName).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const box = document.getElementById('supplierPayListBox');
    box.innerHTML = `<div style="overflow-x:auto;"><table><thead><tr><th></th><th>${t('colNo')}</th><th>${t('jDate')}</th><th>${t('colCustomer')}</th><th>${t('colTicketNo')}</th><th>${t('colAmount')}</th></tr></thead>

      <div style="margin-top:10px;font-weight:700;">${t('selectedTotalLabel')}: <span id="supplierPayTotal">${money(0)}</span></div>`;
    box.querySelectorAll('.supPayChk').forEach(chk=>{
      chk.onchange = ()=>{
        const checked = [...box.querySelectorAll('.supPayChk:checked')];
        const total = checked.reduce((s,c)=>s+Number(c.dataset.amt||0),0);
        document.getElementById('supplierPayTotal').textContent = money(total);

  renderList(suppliers[0]);

    const btn = document.getElementById('supplierPaySubmitBtn'); btn.disabled=true; btn.textContent=t('saving');
    const ids = [...document.querySelectorAll('.supPayChk:checked')].map(c=>c.dataset.id);
    try{ await settleSupplierBulk(ids); closeModal(); render(); }
    catch(err){ console.error(err); document.getElementById('supplierPayErrorBox').innerHTML = `<div class="login-error">${t('connError')}</div>`; btn.disabled=false; btn.textContent=t('registerPaymentBtn'); }
  };
}

/* ===================== REPORTS ===================== */
let reportGroupBy = 'branch';
let reportSearchTerm = '';
let reportSupplierFilter = 'all';
let reportBranchFilter = 'all';
let reportEmployeeFilter = 'all';
let reportDateFrom = null;
let reportDateTo = null;
function reportFilteredBookings(){
  return bookings.filter(b=>
    (reportSupplierFilter==='all' || b.supplier===reportSupplierFilter) &&
    (reportBranchFilter==='all' || b.branch_id===reportBranchFilter) &&
    (reportEmployeeFilter==='all' || b.created_by===reportEmployeeFilter) &&
    (!reportDateFrom || b.date>=reportDateFrom) && (!reportDateTo || b.date<=reportDateTo));
}
function setReportQuickRange(kind){
  const today = todayStr();
  let from = today;
  if(kind==='month') from = today.slice(0,8)+'01';
  else if(kind==='year') from = today.slice(0,4)+'-01-01';
  reportDateFrom = from; reportDateTo = today;
  renderReports();
}
function renderReports(){
  document.getElementById('pageSub').textContent = t('subReports');
  const groupBy = reportGroupBy;
  const scoped = reportFilteredBookings();
  const suppliers = [...new Set(bookings.map(b=>b.supplier).filter(Boolean))];
  let rows = [];
  if(groupBy==='employee'){
    rows = users.map(u=>{
      const bl = scoped.filter(x=>x.created_by===u.id);
      const tt = computeTotals(bl, []);
      const margin = tt.sales>0 ? (tt.netProfit/tt.sales*100) : 0;
      return {name:u.name, sub:branchName(u.branch_id), ...tt, margin};
    }).filter(r=>r.count>0 || !reportSearchTerm);
  }else{
    rows = branches.map(b=>{
      const bl = scoped.filter(x=>x.branch_id===b.id);
      const exp = manualExpenses.filter(e=>e.branch_id===b.id && (!reportDateFrom||e.date>=reportDateFrom) && (!reportDateTo||e.date<=reportDateTo));
      const tt = computeTotals(bl, exp);
      const margin = tt.revenue>0 ? (tt.netProfit/tt.revenue*100) : 0;
      return {name:b.name, sub:null, ...tt, margin};
    });
  }
  if(reportSearchTerm){
    const term = reportSearchTerm.toLowerCase();
    rows = rows.filter(r=> r.name.toLowerCase().includes(term) || (r.sub||'').toLowerCase().includes(term));
  }
  const nameHeader = groupBy==='employee' ? t('colUserName') : t('colBranchName');
  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-head"><h3 class="panel-title">${t('reconcileFiltersTitle')}</h3></div>
      <div class="grid-2">
        <div class="field"><label>${t('colSupplier')}</label><select id="repSupplier"><option value="all" ${reportSupplierFilter==='all'?'selected':''}>${t('allSuppliersOpt')}</option>${suppliers.map(s=>`<option value="${s}" ${reportSupplierFilter===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field"><label>${t('fieldBranch')}</label><select id="repBranch"><option value="all" ${reportBranchFilter==='all'?'selected':''}>${t('allBranches')}</option>${branches.map(b=>`<option value="${b.id}" ${reportBranchFilter===b.id?'selected':''}>${b.name}</option>`).join('')}</select></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>${t('fieldEmployeeFilter')}</label><select id="repEmployee"><option value="all" ${reportEmployeeFilter==='all'?'selected':''}>${t('allEmployeesOpt')}</option>${users.map(u=>`<option value="${u.id}" ${reportEmployeeFilter===u.id?'selected':''}>${u.name}</option>`).join('')}</select></div>
        <div class="field"><label></label>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button type="button" class="btn btn-ghost btn-sm" id="repToday">${t('quickToday')}</button>
            <button type="button" class="btn btn-ghost btn-sm" id="repMonth">${t('quickMonth')}</button>
            <button type="button" class="btn btn-ghost btn-sm" id="repYear">${t('quickYear')}</button>
          </div>
        </div>
      </div>
      <div class="grid-2">
        <div class="field"><label>${t('fieldDateFrom')}</label><input type="date" id="repDateFrom" value="${reportDateFrom||''}"></div>
        <div class="field"><label>${t('fieldDateTo')}</label><input type="date" id="repDateTo" value="${reportDateTo||''}"></div>
      </div>
    </div>
    <div class="panel"><div class="panel-head"><h3 class="panel-title">${t('salesByBranch')}</h3></div>${branchBarsHTML('sales')}</div>
    ${isAdmin()?`<div class="panel"><div class="panel-head"><h3 class="panel-title">${t('profitByBranch')}</h3></div>${branchBarsHTML('profit')}</div>`:''}
    <div class="panel">
      <div class="panel-head"><h3 class="panel-title">${t('branchTable')}</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <select class="select-ctrl" id="reportGroupBySel">
            <option value="branch" ${groupBy==='branch'?'selected':''}>${t('groupByBranch')}</option>
            <option value="employee" ${groupBy==='employee'?'selected':''}>${t('groupByEmployee')}</option>
          </select>
          <input class="select-ctrl" id="reportSearchInput" type="text" placeholder="${t('searchPlaceholder')}" value="${reportSearchTerm}">
          <button class="btn btn-ghost btn-sm" id="reportPrintBtn">${t('printReport')}</button>
        </div>
      </div>
      ${rows.length===0?`<div class="empty">${t('emptyData')}</div>`:`<div style="overflow-x:auto;">
      <table><thead><tr><th>${nameHeader}</th>${groupBy==='employee'?`<th>${t('colUserBranch')}</th>`:''}<th>${t('colBookCount')}</th><th>${t('colSalesTotal')}</th><th>${t('colCostTotal')}</th><th>${t('colCommTotal')}</th>${groupBy==='branch'?`<th>${t('colExpTotal')}</th>`:''}<th>${t('colNetProfitCol')}</th><th>${t('colMargin')}</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r.name}</td>${groupBy==='employee'?`<td>${r.sub||'—'}</td>`:''}<td class="num">${r.count}</td><td class="num">${canSeeSell()?money(r.sales):moneyOrHidden(0)}</td><td class="num">${money(r.cost)}</td>
          <td class="num">${money(r.commission)}</td>${groupBy==='branch'?`<td class="num">${money(r.expenses)}</td>`:''}<td class="num ${r.netProfit>=0?'pos':'neg'}" style="font-weight:600">${moneyOrHidden(r.netProfit)}</td><td class="num">${canSeeProfit()?r.margin.toFixed(1)+'%':t('hiddenValue')}</td></tr>`).join('')}</tbody></table></div>`}
    </div>`;
  document.getElementById('reportPrintBtn').onclick = ()=>printBranchEmployeeReport(rows, groupBy, nameHeader);
  document.getElementById('reportGroupBySel').onchange = (e)=>{ reportGroupBy = e.target.value; renderReports(); };
  document.getElementById('reportSearchInput').oninput = (e)=>{ reportSearchTerm = e.target.value; renderReports(); };
  document.getElementById('repSupplier').onchange = (e)=>{ reportSupplierFilter = e.target.value; renderReports(); };
  document.getElementById('repBranch').onchange = (e)=>{ reportBranchFilter = e.target.value; renderReports(); };
  document.getElementById('repEmployee').onchange = (e)=>{ reportEmployeeFilter = e.target.value; renderReports(); };
  document.getElementById('repDateFrom').onchange = (e)=>{ reportDateFrom = e.target.value||null; renderReports(); };
  document.getElementById('repDateTo').onchange = (e)=>{ reportDateTo = e.target.value||null; renderReports(); };
  document.getElementById('repToday').onclick = ()=>setReportQuickRange('today');
  document.getElementById('repMonth').onclick = ()=>setReportQuickRange('month');
  document.getElementById('repYear').onclick = ()=>setReportQuickRange('year');
}

      branches, users, bookings, journal, manual_expenses: manualExpenses, cash_deposits: deposits
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);

}

        <div id="reconcileModeAmountNameBox" class="grid-2" style="display:none;">
          <div class="field"><label>${t('reconcileAmountColLabel')}</label><select id="reconcileAmountColSel"></select></div>
          <div class="field"><label>${t('reconcileNameColLabel')}</label><select id="reconcileNameColSel"></select></div>
        </div>
        <button class="btn btn-primary btn-sm" id="reconcileRunBtn" style="margin-top:8px;">${t('reconcileRunBtn')}</button>
      </div>
      <div id="reconcileResultBox" style="margin-top:14px;"></div>
    </div>`;
  ['rfSupplier','rfBranch','rfEmployee','rfDateFrom','rfDateTo'].forEach(id=>{
    document.getElementById(id).onchange = updateReconcileCount;
  });
  document.getElementById('rfToday').onclick = ()=>setReconcileQuickRange('today');
  document.getElementById('rfMonth').onclick = ()=>setReconcileQuickRange('month');
  document.getElementById('rfYear').onclick = ()=>setReconcileQuickRange('year');
  document.getElementById('reconcileFileInput').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'binary'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
        if(rows.length===0){ alert(t('reconcileEmptyFile')); return; }
        reconcileRows = rows;
        reconcileHeaders = Object.keys(rows[0]);
        const opts = reconcileHeaders.map(h=>`<option value="${h}">${h}</option>`).join('');
        document.getElementById('reconcileColSel').innerHTML = opts;
        document.getElementById('reconcileAmountColSel').innerHTML = opts;
        document.getElementById('reconcileNameColSel').innerHTML = opts;
        document.getElementById('reconcileColumnBox').style.display = '';
        document.getElementById('reconcileResultBox').innerHTML = '';
      }catch(err){ console.error(err); alert(t('reconcileParseError')); }
    };
    reader.readAsBinaryString(file);
  };
  document.getElementById('reconcileModeSel').onchange = (e)=>{
    const isAmountName = e.target.value==='amountName';
    document.getElementById('reconcileModeTicketBox').style.display = isAmountName?'none':'';
    document.getElementById('reconcileModeAmountNameBox').style.display = isAmountName?'':'none';
  };
  document.getElementById('reconcileRunBtn').onclick = ()=>{
    const mode = document.getElementById('reconcileModeSel').value;
    const scoped = getReconcileFilteredBookings();
    const missing = [];
    let matched = 0;
    let col, otherCols;
    if(mode==='ticket'){
      col = document.getElementById('reconcileColSel').value;
      const systemTickets = new Set(scoped.filter(b=>b.ticket_no).map(b=>String(b.ticket_no).trim().toUpperCase()));
      reconcileRows.forEach(row=>{
        const raw = row[col];
        if(raw===undefined || raw===null || String(raw).trim()==='') return;
        const val = String(raw).trim().toUpperCase();
        if(systemTickets.has(val)) matched++;
        else missing.push(row);
      });
      otherCols = reconcileHeaders.filter(h=>h!==col).slice(0,4);
    }else{
      const amtCol = document.getElementById('reconcileAmountColSel').value;
      const nameCol = document.getElementById('reconcileNameColSel').value;
      col = nameCol;
      const systemPairs = scoped.map(b=>({name:String(b.customer||'').trim().toUpperCase(), amt:+Number(b.sell||0).toFixed(2), emp:userName(b.created_by)}));
      reconcileRows.forEach(row=>{
        const rawName = row[nameCol], rawAmt = row[amtCol];
        if((rawName===undefined||String(rawName).trim()==='') && (rawAmt===undefined||String(rawAmt).trim()==='')) return;
        const name = String(rawName||'').trim().toUpperCase();
        const amt = +Number(rawAmt||0).toFixed(2);
        const hit = systemPairs.find(p=>p.name===name && Math.abs(p.amt-amt)<0.01);
        if(hit) matched++; else missing.push(row);
      });
      otherCols = reconcileHeaders.filter(h=>h!==nameCol && h!==amtCol).slice(0,4);
    }
    const box = document.getElementById('reconcileResultBox');
    box.innerHTML = `
      <div class="kpi-row" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px;">
        <div class="kpi" style="--accent:var(--teal)"><div class="kpi-label">${t('reconcileTotalRows')}</div><div class="kpi-value">${reconcileRows.length}</div></div>
        <div class="kpi" style="--accent:var(--gold)"><div class="kpi-label">${t('reconcileMatched')}</div><div class="kpi-value">${matched}</div></div>
        <div class="kpi" style="--accent:var(--red)"><div class="kpi-label">${t('reconcileMissing')}</div><div class="kpi-value neg">${missing.length}</div></div>
      </div>
      ${missing.length===0?`<div class="empty">${t('reconcileAllMatched')}</div>`:`
      <div class="note" style="color:var(--red);font-weight:600;">⚠️ ${t('reconcileMissingNote')}</div>
      <div style="overflow-x:auto;margin-top:8px;"><table><thead><tr><th>${col}</th>${otherCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${missing.map(row=>`<tr><td style="font-weight:700;color:var(--red);">${row[col]}</td>${otherCols.map(c=>`<td>${row[c]??''}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`}`;
  };
}

/* ===================== MODAL ===================== */
function openMyAccountModal(){
  const u = currentUser();
  showModal(`
    <div class="modal-head"><h3>${t('modalMyAccount')}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <form id="myAccountForm">
      <div class="field"><label>${t('fieldNewUsername')}</label><input name="newUsername" value="${u.username}" required></div>
      <div class="field"><label>${t('fieldCurrentPassword')}</label><input type="password" name="currentPassword" required></div>
      <div class="grid-2">
        <div class="field"><label>${t('fieldNewPassword')}</label><input type="password" name="newPassword"></div>
        <div class="field"><label>${t('fieldConfirmPassword')}</label><input type="password" name="confirmPassword"></div>
      </div>
      <div class="note">${t('leaveBlankNote')}</div>
      <div id="myAccountErrorBox"></div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:start;">
        <button type="submit" class="btn btn-primary" id="myAccountSaveBtn">${t('saveAccount')}</button>
        <button type="button" class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      </div>
    </form>`);
  document.getElementById('myAccountForm').onsubmit = async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('myAccountSaveBtn');
    const f = new FormData(e.target);
    const newPassword = f.get('newPassword')||'';
    const confirmPassword = f.get('confirmPassword')||'';
    if(newPassword !== confirmPassword){
      document.getElementById('myAccountErrorBox').innerHTML = `<div class="login-error">${t('passwordMismatch')}</div>`;
      return;
    }
    btn.disabled=true; btn.textContent=t('saving');
    try{
      const {data:ok, error} = await sb.rpc('update_own_account', {
        p_user_id: u.id, p_current_password: f.get('currentPassword'),
        p_new_username: f.get('newUsername'), p_new_password: newPassword
      });
      if(error){
        if(String(error.message||'').toLowerCase().includes('duplicate')){ document.getElementById('myAccountErrorBox').innerHTML = `<div class="login-error">${t('usernameTaken')}</div>`; btn.disabled=false; btn.textContent=t('saveAccount'); return; }
        throw error;
      }
      if(!ok){ document.getElementById('myAccountErrorBox').innerHTML = `<div class="login-error">${t('wrongCurrentPassword')}</div>`; btn.disabled=false; btn.textContent=t('saveAccount'); return; }
      const updatedUser = { ...u, username: f.get('newUsername') };
      setSession(updatedUser);
      const localUser = users.find(x=>x.id===u.id); if(localUser) localUser.username = f.get('newUsername');
      closeModal(); alert(t('accountUpdated')); render();
    }catch(err){
      console.error(err);
      document.getElementById('myAccountErrorBox').innerHTML = `<div class="login-error">${t('connError')}</div>`;
      btn.disabled=false; btn.textContent=t('saveAccount');
    }
  };
}
function showModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('overlay').classList.add('show'); }
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
window.closeModal = closeModal;
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

/* ===================== INIT ===================== */
boot();
</script>
</body>
</html>
