<style>
  :root{
    --navy:#0F2A3D; --navy-2:#153A50; --teal:#1A6E7E; --gold:#D9A544; --gold-2:#C98A2E;
    --paper:#FBF7EE; --panel:#FFFFFF; --ink:#1C1C1C; --ink-soft:#5B6570;
    --line:#E4DECB; --red:#B4402F; --green:#2F7A52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
  .app{display:flex;min-height:100vh;}

  .sidebar{width:235px;flex-shrink:0;background:var(--navy);color:#EDE7D6;padding:22px 16px;display:flex;flex-direction:column;gap:4px;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px 6px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
  .brand-mark{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--gold);font-size:16px;}
  .brand-name{font-weight:600;font-size:14.5px;line-height:1.3;}
  .brand-sub{font-size:10.5px;color:#9FB0B9;letter-spacing:.5px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#D9E1E6;
    transition:background .15s;border:none;background:none;text-align:start;width:100%;font-family:inherit;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--gold);color:var(--navy);font-weight:600;}
  .nav-icon{width:18px;text-align:center;font-size:14px;}
  .sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);font-size:10.5px;color:#8FA0AA;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .page-title{font-size:18px;font-weight:600;margin:0;}
  .page-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .select-ctrl{font-family:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
  .content{padding:22px 26px;overflow-y:auto;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden;}
  .kpi::before{content:"";position:absolute;top:0;inset-inline-end:0;width:4px;height:100%;background:var(--accent,var(--teal));}
  .kpi-label{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
  .kpi-value{font-size:21px;font-weight:700;letter-spacing:-.2px;}
  .kpi-value.pos{color:var(--green);} .kpi-value.neg{color:var(--red);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .panel-title{font-size:14.5px;font-weight:600;margin:0;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:start;padding:9px 8px;color:var(--ink-soft);font-weight:500;border-bottom:1.5px solid var(--line);font-size:11.5px;white-space:nowrap;}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAF8F0;}
  .num{font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;}
  .tag.paid{background:#E4F1E8;color:var(--green);}
  .tag.pending{background:#FBEFE0;color:#A8722C;}
  .tag.collected{background:#E4F1E8;color:var(--green);}
  .tag.admin{background:#E6E0F5;color:#5B3FA0;}
  .tag.employee{background:#E6F0F5;color:var(--teal);}
  .tag.accountant{background:#FFF1DE;color:#A8722C;}
  .tag.rejected{background:#F7E7E4;color:var(--red);}

  .btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.88;} .btn:disabled{opacity:.5;cursor:default;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-gold{background:var(--gold);color:var(--navy);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn-sm{padding:5px 11px;font-size:12px;}
  .btn-danger{background:#F7E7E4;color:var(--red);}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);font-family:inherit;font-size:13.5px;background:var(--paper);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  .overlay{position:fixed;inset:0;background:rgba(15,42,61,.45);display:none;align-items:center;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel);border-radius:12px;padding:22px 24px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:16px;}
  .close-x{cursor:pointer;font-size:18px;color:var(--ink-soft);background:none;border:none;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .bar-label{width:130px;font-size:12.5px;flex-shrink:0;}
  .bar-track{flex:1;height:20px;background:#F1EBDB;border-radius:5px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--navy));border-radius:5px;}
  .bar-val{width:110px;text-align:end;font-size:12px;flex-shrink:0;}
  .empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:26px 0;}
  .note{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .section-flex{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,rgba(217,165,68,.08),transparent 60%),var(--navy);}
  .login-card{background:var(--panel);border-radius:16px;padding:34px 32px;width:380px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-mark{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--gold);margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--gold-2);font-size:24px;background:var(--navy);}
  .login-agency-ar{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;text-align:center;}
  .login-agency-en{font-size:10.5px;letter-spacing:1.4px;color:var(--ink-soft);text-align:center;margin-bottom:20px;}
  .login-error{background:#F7E7E4;color:var(--red);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:12px;}
  .login-demo{font-size:11px;color:var(--ink-soft);margin-top:14px;text-align:center;line-height:1.6;}

  .setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px;}
  .setup-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;max-width:560px;}
  .setup-card h2{margin-top:0;color:var(--navy);}
  .setup-card code{background:var(--paper);padding:2px 6px;border-radius:4px;font-size:12.5px;}
  .setup-card pre{background:var(--navy);color:#EDE7D6;padding:14px;border-radius:8px;font-size:12px;overflow-x:auto;direction:ltr;text-align:left;}

  @media (max-width:980px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .grid-2,.grid-3{grid-template-columns:1fr;}
    .sidebar{width:180px;}
    .section-flex{flex-direction:column;}
  }
</style>
</head>

/* Supabase returns at most 1000 rows per request — read every page so nothing is silently cut off */
async function fetchAllRows(table, cols, asc){
  const PAGE = 1000; let from = 0; const out = [];
  for(;;){
    const {data, error} = await sb.from(table).select(cols).order('created_at', {ascending:!!asc}).order('id', {ascending:true}).range(from, from+PAGE-1);
    if(error) return {data:null, error};
    out.push(...(data||[]));
    if(!data || data.length<PAGE) break;
    from += PAGE;
  }
  return {data:out, error:null};
}

async function postRefundReversal(bookingId){
  const b = bookings.find(x=>x.id===bookingId);
  if(!b) return;
  if(journal.some(j=>j.booking_id===bookingId && j.desc_key==='jRefund')) return; // already posted
  const refundAmt = bookingRefundAmount({...b, refunded:true});
  if(refundAmt<=0) return;
  const hasBankReceipt = journal.some(j=>j.booking_id===bookingId && j.desc_key==='jBankReceipt');
  // customer money that was never confirmed in the bank: refunding it just cancels the receivable
  let unconfirmed = 0;
  if(b.payment_method==='split' && Array.isArray(b.payment_splits)) unconfirmed = b.payment_splits.filter(s=>s.method!=='cash' && !s.verified).reduce((a,s)=>a+Number(s.amount||0),0);
  else if(b.payment_method!=='cash' && !hasBankReceipt) unconfirmed = Number(b.sell)||0;
  const fromReceivable = (b.refund_method||'cash')==='cash' ? 0 : +Math.min(refundAmt, unconfirmed).toFixed(2);
  const paidOut = +(refundAmt - fromReceivable).toFixed(2);
  const base = { date:todayStr(), branch_id:b.branch_id, booking_id:bookingId, desc_key:'jRefund', desc_args:[b.booking_no] };
  const rows = [];
  if(fromReceivable>0) rows.push({...base, debit_key:'accSalesRev', credit_key:'accCustomers', amount:fromReceivable});
  if(paidOut>0) rows.push({...base, debit_key:'accSalesRev', credit_key:(b.refund_method||'cash')==='cash' ? 'accCashOnHand' : 'accBank', amount:paidOut});
  const supAmt = Number(b.supplier_refund_amount)||0;
  if(supAmt>0 && bookingSupplierRefund(b)<=0.004)
    rows.push({...base, desc_key:'jSupplierRefund', debit_key:'accSuppliers', credit_key:'accCogs', amount:+supAmt.toFixed(2)});
  if(rows.length>0){
    const {data:jIns, error:jErr} = await sb.from('journal').insert(rows).select();
    if(jErr) throw jErr;
    journal.unshift(...jIns.reverse());
  }
}

function supplierDepositCredit(name){
  const paid = deposits.filter(d=>d.status==='approved' && d.destination===name).reduce((a,d)=>a+Number(d.amount||0),0);
  const used = bookings.filter(b=>b.supplier===name && b.supplier_settled && b.supplier_paid_via==='deposit').reduce((a,b)=>a+(b.supplier_paid_amount!=null?Number(b.supplier_paid_amount):Number(b.cost||0)),0);

function supplierBalances(list){
  const map = {};
  list.forEach(b=>{
    if(!b.supplier || !(Number(b.cost)>0)) return;
    if(!map[b.supplier]) map[b.supplier] = {owed:0, settled:0};
    const cost = Number(b.cost)||0, supRef = bookingSupplierRefund(b);
    if(b.supplier_settled){
      const paid = b.supplier_paid_amount!=null ? Number(b.supplier_paid_amount) : cost;
      map[b.supplier].settled += paid;
      map[b.supplier].owed += cost - paid - supRef;   // negative = supplier owes us a refund
    } else map[b.supplier].owed += cost - supRef;
  });
  Object.values(map).forEach(m=>{ m.owed = +m.owed.toFixed(2); m.settled = +m.settled.toFixed(2); });
  SUPPLIER_DESTINATIONS.forEach(n=>{ const c = supplierDepositCredit(n); if(c.paid>0 && !map[n]) map[n] = {owed:0, settled:0}; });
  Object.keys(map).forEach(n=>{ const c = supplierDepositCredit(n); map[n].depositCredit = c.available; map[n].net = +(map[n].owed - c.available).toFixed(2); });
  return map;
}

/* One source of truth for every non-cash payment (transfer / span / installment / non-cash split part) */
function transferParts(b){
  const out = [];
  if(!b) return out;
  const full = bookingIsFullRefund(b);
  // A refund paid by transfer first cancels customer money not yet confirmed (bank in = bank out).
  // A refund paid in CASH does not: the customer's transfer still has to be confirmed in the bank.
  // How much of the refund cancelled unconfirmed customer money is read from the refund entry actually posted
  // (older refunds were posted with different rules — reading the entry keeps old and new data consistent).
  let refundLeft = 0;
  if(b.refunded){
    const rr = jrows(b.id).filter(j=>j.desc_key==='jRefund');
    refundLeft = rr.length
      ? +Math.max(0, rr.reduce((a,j)=>a+(j.credit_key==='accCustomers'?Number(j.amount)||0:0)-(j.debit_key==='accCustomers'?Number(j.amount)||0:0),0)).toFixed(2)
      : ((b.refund_method||'cash')!=='cash' ? bookingRefundAmount(b) : 0);
  }
  const push = (part, amt, method, bank, verified, verifiedAmt, confirmedAt)=>{
    if(verified){
      out.push({b, part, amount:amt, counted: full ? 0 : (verifiedAmt!=null ? +Number(verifiedAmt).toFixed(2) : amt), status: full ? 'refunded' : 'confirmed', method, bank, confirmedAt});
      return;
    }
    const take = +Math.min(amt, refundLeft).toFixed(2); refundLeft = +(refundLeft - take).toFixed(2);
    const rest = +(amt - take).toFixed(2);
    out.push({b, part, amount:amt, counted: rest>0.004 ? rest : 0, status: rest>0.004 ? 'pending' : 'refunded', method, bank, confirmedAt:null});
  };
  if(b.payment_method==='split' && Array.isArray(b.payment_splits)){
    b.payment_splits.forEach((p,i)=>{
      if(p.method==='cash') return;
      push(i, +(Number(p.amount)||0).toFixed(2), p.method, p.bankName||null, !!p.verified, p.verified_amount, p.verified_at||null);
    });
  }else if(b.payment_method!=='cash'){
    const sell = +(Number(b.sell)||0).toFixed(2);
    const confirmed = b.payment_status==='paid' || !!b.transfer_verified;
    if(!confirmed && b.payment_status!=='pending'){ out.push({b, part:null, amount:sell, counted:0, status:'other', method:b.payment_method, bank:b.bank_name||null, confirmedAt:null}); return out; }
    push(null, sell, b.payment_method, b.bank_name||null, confirmed, b.verified_amount, b.transfer_verified_at||null);
  }
  return out;
}
function bookingPendingAmount(b){ return +transferParts(b).filter(p=>p.status==='pending').reduce((s,p)=>s+p.counted,0).toFixed(2); }
function employeeFinancialSummary(employeeId){
  const mine = bookings.filter(b=>b.created_by===employeeId);
  const totalSales = +mine.reduce((s,b)=>s+bookingEffectiveSell(b),0).toFixed(2);
  const totalDeposited = +deposits.filter(d=>d.submitted_by===employeeId && d.status==='approved').reduce((s,d)=>s+Number(d.amount||0),0).toFixed(2);
  const parts = mine.flatMap(transferParts);
  const totalTransferred = +parts.filter(p=>p.status==='confirmed').reduce((s,p)=>s+p.counted,0).toFixed(2);
  const pendingTransfers = +parts.filter(p=>p.status==='pending').reduce((s,p)=>s+p.counted,0).toFixed(2);
  const cashOnHand = employeeCashOnHand(employeeId);
  const charges = outstandingEmployeeCharges(employeeId);
  const pendingAmt = +(pendingTransfers + cashOnHand + charges).toFixed(2);
  return {totalSales, totalDeposited, totalTransferred, pendingAmt, pendingTransfers, cashOnHand, charges};
}
function pendingConfirmationAmount(list){
  return +list.flatMap(transferParts).filter(p=>p.status==='pending').reduce((s,p)=>s+p.counted,0).toFixed(2);
}
function pendingProfitHandoverAmount(list){
  const lockedIds = new Set();
  profitHandovers.filter(h=>h.status==='pending'||h.status==='approved').forEach(h=>(h.booking_ids||[]).forEach(id=>lockedIds.add(id)));
  return +list.filter(b=>b.cost_reviewed && !(b.refunded && !bookingSupplierRefundKnown(b)) && !lockedIds.has(b.id)).reduce((s,b)=>s+bookingProfitNow(b),0).toFixed(2);
}
function computeTotals(bookingsList, expensesList){
  const active = bookingsList.filter(b=>!bookingIsFullRefund(b));
  const sales = bookingsList.reduce((s,b)=>s+bookingEffectiveSell(b),0);
  const reviewed = bookingsList.filter(b=>b.cost_reviewed);
  const pendingReview = active.filter(b=>!b.cost_reviewed);
  const cost = reviewed.reduce((s,b)=>s+bookingEffectiveCost(b),0);
  const commission = active.reduce((s,b)=>s+Number(b.commission),0);
  const manualExp = expensesList.reduce((s,e)=>s+Number(e.amount),0);
  const ids = new Set(bookingsList.map(b=>b.id));
  const cardFees = +(typeof journal!=='undefined' ? journal : []).filter(j=>j.desc_key==='jCardFee' && ids.has(j.booking_id)).reduce((s,j)=>s+Number(j.amount||0),0).toFixed(2);
  const expenses = manualExp + cardFees;
  const revenue = sales+commission;
  const reviewedProfit = reviewed.reduce((s,b)=>s+bookingProfitNow(b),0);
  const netProfit = reviewedProfit+commission-expenses;
  const pendingReviewSales = pendingReview.reduce((s,b)=>s+bookingEffectiveSell(b),0);
  const pendingCommission = active.filter(b=>b.commission_status==='pending').reduce((s,b)=>s+Number(b.commission),0);
  return {sales,cost,commission,expenses,cardFees,manualExpenses:manualExp,revenue,netProfit,pendingCommission,pendingReviewCount:pendingReview.length,pendingReviewSales,count:active.length};
}

  app.innerHTML = `<div class="login-wrap" style="color:#EDE7D6;">Loading... / جاري التحميل...</div>`;

let autoRefreshInterval = null;
function startAutoRefresh(){
  if(autoRefreshInterval) return;
  autoRefreshInterval = setInterval(async ()=>{
    if(!getSession() || document.hidden) return;
    const overlay = document.getElementById('overlay');
    if(overlay && overlay.classList.contains('show')) return;
    // never wipe work in progress: the reconciliation page (uploaded file, chosen columns, results)
    // and any form field the user is typing in keep their state — data refreshes, the screen does not
    const ae = document.activeElement;
    const typing = ae && ['INPUT','SELECT','TEXTAREA'].includes(ae.tagName);
    if(route==='reconcile') return;
    try{ await fetchAll(); if(!typing) render(); }catch(e){ console.error('auto-refresh failed', e); }
  }, 15000);
}
function stopAutoRefresh(){
  if(autoRefreshInterval){ clearInterval(autoRefreshInterval); autoRefreshInterval=null; }
}

function renderLogin(app){

    const f = new FormData(e.target);
    const uname = (f.get('username')||'').trim();
    const pwd = f.get('password')||'';
    try{
      const {data, error} = await sb.rpc('verify_login', {p_username: uname, p_password: pwd});
      if(error) throw error;
      if(data && data.length>0){ setSession(data[0]); boot(); }

      btn.disabled=false; btn.textContent=t('loginBtn');
    }
  };

function branchBarsHTML(metric, sourceBookings){
  const list = sourceBookings || bookings;
  const rows = branches.map(b=>{
    const bl = list.filter(x=>x.branch_id===b.id);
    const tt = computeTotals(bl, manualExpenses.filter(e=>e.branch_id===b.id));
    return {name:b.name, val: metric==='sales'?tt.sales:tt.netProfit};
  });
  const max = Math.max(1, ...rows.map(r=>r.val));
  if(rows.length===0) return `<div class="empty">${t('emptyBranches')}</div>`;
  return rows.map(r=>`<div class="bar-row"><div class="bar-label">${esc(r.name)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,(r.val/max*100))}%"></div></div>
    <div class="bar-val num">${money(r.val)}</div></div>`).join('');
}

function employeeCashStatement(employeeId, from, to){
  const ar = lang==='ar';
  const all = [];
  bookings.filter(b=>b.created_by===employeeId).forEach(b=>{
    const amt = bookingCashNet(b);
    if(Math.abs(amt)<0.005) return;
    const sell = Number(b.sell)||0;
    const cashIn = b.payment_method==='cash' ? sell : (Array.isArray(b.payment_splits) ? b.payment_splits.filter(x=>x.method==='cash').reduce((a,x)=>a+Number(x.amount||0),0) : 0);
    let note = ar ? `كاش مستلم ${money(cashIn)} (تكلفة ${money(b.cost)} + ربح ${money(sell-Number(b.cost||0))})` : `Cash received ${money(cashIn)} (cost ${money(b.cost)} + profit ${money(sell-Number(b.cost||0))})`;
    if(b.refunded) note += ar ? ` — استرجاع ${money(bookingRefundAmount(b))} (${(b.refund_method||'cash')==='cash'?'كاش':'تحويل'})` : ` — refund ${money(bookingRefundAmount(b))} (${b.refund_method||'cash'})`;
    all.push({date:b.date||'', stamp:b.created_at||'', type: ar?'تذكرة':'Ticket', desc:`#${b.booking_no} ${b.customer||''}`, note, amt});
  });
  miscReceipts.filter(r=>r.employee_id===employeeId && r.status==='confirmed' && r.method==='cash').forEach(r=>{
    all.push({date:(r.created_at||'').slice(0,10), stamp:r.created_at||'', type: ar?'مبلغ بدون تذكرة':'Misc receipt', desc:r.note||'—',
      note: ar?`سجّله: ${userName(r.created_by)}`:`Recorded by ${userName(r.created_by)}`, amt:+(Number(r.amount)||0)});
  });
  deposits.filter(d=>d.submitted_by===employeeId && d.status==='approved').forEach(d=>{
    all.push({date:(d.created_at||'').slice(0,10), stamp:d.created_at||'', type: ar?'إيداع معتمد':'Approved deposit', desc:destLabel(d.destination),
      note:(ar?'اعتُمد ':'approved ')+(d.reviewed_at||'').slice(0,10)+(d.note?` — ${d.note}`:''), amt:-(Number(d.amount)||0)});
  });
  profitHandovers.filter(h=>h.employee_id===employeeId && h.status==='approved').forEach(h=>{
    all.push({date:(h.created_at||'').slice(0,10), stamp:h.created_at||'', type: ar?'أرباح سُلّمت للإدارة':'Profit handed to management', desc:(h.date_from||h.date_to)?`${h.date_from||'…'} → ${h.date_to||'…'}`:'—',
      note:(ar?`${(h.booking_ids||[]).length} تذكرة — اعتُمد `:`${(h.booking_ids||[]).length} tickets — approved `)+(h.reviewed_at||'').slice(0,10), amt:-(Number(h.total_profit)||0)});
  });
  all.sort((a,b)=>a.date.localeCompare(b.date) || a.stamp.localeCompare(b.stamp));
  let bal = 0, opening = 0, periodIn = 0, periodOut = 0;
  const rows = [];
  all.forEach(r=>{
    bal = +(bal + r.amt).toFixed(2);
    if(from && r.date < from){ opening = bal; return; }
    if(to && r.date > to) return;
    r.bal = bal; rows.push(r);
    if(r.amt>=0) periodIn += r.amt; else periodOut += -r.amt;
  });
  const closing = +(opening + periodIn - periodOut).toFixed(2);
  const pendingDeps = deposits.filter(d=>d.submitted_by===employeeId && d.status==='pending' && inStmtRange((d.created_at||'').slice(0,10), from, to));
  return {rows: rows.reverse(), opening:+opening.toFixed(2), periodIn:+periodIn.toFixed(2), periodOut:+periodOut.toFixed(2), closing, current: bal, pendingDeps};
}

function employeeTransferStatement(employeeId, from, to){
  const rows = bookings.filter(b=>b.created_by===employeeId && inStmtRange(b.date||'', from, to)).flatMap(transferParts)
    .sort((a,b)=>(b.b.date||'').localeCompare(a.b.date||'') || (b.b.created_at||'').localeCompare(a.b.created_at||''));
  const sum = st=>+rows.filter(r=>r.status===st).reduce((s,r)=>s+r.counted,0).toFixed(2);
  const refundedSum = +rows.filter(r=>r.status==='refunded').reduce((s,r)=>s+r.amount,0).toFixed(2);
  return {rows, confirmed:sum('confirmed'), pending:sum('pending'), refunded:refundedSum};
}

/* Warn when an amount-without-ticket looks like it duplicates transfers already recorded on tickets */
function miscDuplicateWarning(employeeId, amount, method){
  if(method==='cash') return '';
  const amt = +Number(amount||0).toFixed(2);
  if(!(amt>0)) return '';
  const parts = bookings.filter(b=>b.created_by===employeeId).flatMap(transferParts).filter(p=>p.status==='pending');
  const total = +parts.reduce((a,p)=>a+p.counted,0).toFixed(2);
  const single = parts.find(p=>Math.abs(p.counted-amt)<0.01);
  const ar = lang==='ar';
  if(parts.length && Math.abs(total-amt)<0.01)
    return ar ? `⚠️ هذا المبلغ (${money(amt)}) يساوي بالضبط مجموع التحويلات المسجلة على تذاكر هذا الموظف وبانتظار التأكيد.\n\nإذا كان هو نفس التحويل، لا تسجله هنا — المحاسب يؤكد التذاكر من صفحة التحويلات البنكية، وإلا سيُحسب المبلغ مرتين.\n\nهل هو مبلغ مختلف فعلًا وتريد المتابعة؟`
              : `⚠️ This amount (${money(amt)}) equals exactly the transfers already recorded on this employee's tickets awaiting confirmation.\n\nIf it is the same money, do not record it here — confirm the tickets on the bank transfers page, otherwise it is counted twice.\n\nIs it really a different amount?`;
  if(single)
    return ar ? `⚠️ هذا المبلغ (${money(amt)}) يساوي تحويل التذكرة #${single.b.booking_no} (${single.b.customer||''}) المسجل وبانتظار التأكيد.\n\nإذا كان هو نفس التحويل، لا تسجله هنا وإلا سيُحسب مرتين.\n\nهل هو مبلغ مختلف فعلًا وتريد المتابعة؟`
              : `⚠️ This amount (${money(amt)}) equals the recorded transfer of ticket #${single.b.booking_no} awaiting confirmation.\n\nIf it is the same money it will be counted twice.\n\nIs it really a different amount?`;
  return '';
}

function generateBranchReport(branchId, employeeId, dateFrom, dateTo){
  const inRange = (d)=> (!dateFrom || d>=dateFrom) && (!dateTo || d<=dateTo);
  const baseBookings = bookings.filter(b=> (employeeId==='all'||b.created_by===employeeId) && inRange(b.date||''));
  const periodLabel = (dateFrom||dateTo) ? `${dateFrom||'…'} → ${dateTo||'…'}` : t('reportAllPeriod');
  const employeeLabel = employeeId==='all' ? t('allEmployeesOpt') : userName(employeeId);
  let bodyHtml = '';
  let docTitleScope = '';
  if(branchId==='all'){
    docTitleScope = t('allBranches');
    const grandList = baseBookings.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.created_at||'').localeCompare(a.created_at||''));
    const grandExp = manualExpenses.filter(e=>inRange(e.date||''));
    branches.forEach(br=>{
      const list = baseBookings.filter(b=>b.branch_id===br.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.created_at||'').localeCompare(a.created_at||''));
      const exp = manualExpenses.filter(e=>e.branch_id===br.id && inRange(e.date||''));
      if(list.length===0 && exp.length===0) return;
      const tt = computeTotals(list, exp);
      bodyHtml += `<h2 style="border-bottom:2px solid #0F2A3D;padding-bottom:4px;">${esc(br.name)}</h2>${totalsKpisHTML(tt)}${bookingsTableHTML(list)}<div style="height:14px;"></div>`;
    });
    const grandTt = computeTotals(grandList, grandExp);
    bodyHtml += `<h2 style="margin-top:26px;">${t('grandTotalTitle')}</h2>${totalsKpisHTML(grandTt)}`;
  }else{
    docTitleScope = branchName(branchId);
    const list = baseBookings.filter(b=>b.branch_id===branchId).sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.created_at||'').localeCompare(a.created_at||''));
    const exp = manualExpenses.filter(e=>e.branch_id===branchId && inRange(e.date||''));
    const tt = computeTotals(list, exp);
    bodyHtml = `<h2>${t('reportTotalsTitle')}</h2>${totalsKpisHTML(tt)}<h2>${t('reportBookingsTitle')}</h2>${bookingsTableHTML(list)}`;
  }

    <title>${t('reportTitle')} — ${docTitleScope}</title>
    <style>
      body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1C1C1C;padding:24px;}
      h1{font-size:19px;margin:0 0 2px;} .sub{color:#5B6570;font-size:12px;margin-bottom:18px;}
      .meta{display:flex;gap:24px;flex-wrap:wrap;font-size:12.5px;margin-bottom:18px;background:#FBF7EE;padding:10px 14px;border-radius:8px;}
      .meta b{display:block;font-size:11px;color:#5B6570;font-weight:500;margin-bottom:2px;}
      .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
      .kpi{border:1px solid #E4DECB;border-radius:8px;padding:10px 14px;min-width:130px;}
      .kpi div:first-child{font-size:11px;color:#5B6570;margin-bottom:4px;}
      .kpi div:last-child{font-size:16px;font-weight:700;}
      table{width:100%;border-collapse:collapse;font-size:11px;}
      th{background:#0F2A3D;color:#fff;padding:7px 6px;text-align:${lang==='ar'?'right':'left'};white-space:nowrap;}
      td{padding:6px;border-bottom:1px solid #E4DECB;}
      h2{font-size:14px;margin:22px 0 8px;}
      @media print{ body{padding:6px;} h2{page-break-after:avoid;} table{page-break-inside:auto;} tr{page-break-inside:avoid;} }
    </style></head><body>
    <h1>${t('agencyAr')} — ${t('reportTitle')}</h1>
    <div class="sub">${t('agencyEn')}</div>
    <div class="meta">
      <div><b>${t('reportBranchLabel')}</b>${docTitleScope}</div>
      <div><b>${t('reportEmployeeLabel')}</b>${employeeLabel}</div>
      <div><b>${t('reportPeriodLabel')}</b>${periodLabel}</div>
      <div><b>${t('reportGenOn')}</b>${new Date().toLocaleString(lang==='ar'?'ar-SA':'en-US')}</div>
    </div>
    ${bodyHtml}
    </body></html>`;
  const w = window.open('', '_blank');
  if(!w){ alert(errTextPlain()); return; }
  w.document.open(); w.document.write(html); w.document.close();

}

function integrityIssues(){
  const ar = lang==='ar';
  const issues = [];
  const byBooking = {};
  journal.forEach(j=>{ if(j.booking_id){ (byBooking[j.booking_id] = byBooking[j.booking_id] || []).push(j); } });
  const bal = (rows, key, side)=> +rows.reduce((a,j)=>a+(j.debit_key===key?Number(j.amount)||0:0)-(j.credit_key===key?Number(j.amount)||0:0),0).toFixed(2) * (side==='credit'?-1:1);
  const ids = new Set(bookings.map(b=>b.id));
  bookings.forEach(b=>{
    const rows = byBooking[b.id] || [];
    const add = (issue, expected, actual)=>issues.push({b, issue, expected, actual});
    const receipts = rows.filter(j=>j.desc_key==='jBankReceipt').length;
    if(b.payment_method!=='split' && receipts>1) add(ar?'قيد استلام بنكي مكرر':'Duplicate bank receipt', 1, receipts);
    if(b.payment_method!=='cash' && b.payment_method!=='split'){
      if(b.transfer_verified && receipts===0) add(ar?'مؤكَّد بدون قيد بنكي':'Confirmed without bank entry', '—', '—');
      if(!b.transfer_verified && receipts>0) add(ar?'عليه قيد بنكي لكن حالته غير مؤكد':'Has bank entry but not marked confirmed', '—', '—');
    }
    if(!rows.some(j=>j.desc_key==='jSale')) add(ar?'لا يوجد قيد مبيعات':'No sale entry', '—', '—');
    const cust = bal(rows,'accCustomers','debit'), pend = bookingPendingAmount(b);
    if(Math.abs(cust-pend)>0.05) add(ar?'رصيد العملاء لا يطابق المعلّق':'Receivable ≠ pending', pend, cust);
    const rev = bal(rows,'accSalesRev','credit'), expRev = bookingIsFullRefund(b) ? 0 : bookingEffectiveSell(b);
    if(Math.abs(rev-expRev)>0.05) add(ar?'الإيراد في القيود لا يطابق التذكرة':'Revenue entries ≠ ticket', expRev, rev);
    const cogs = bal(rows,'accCogs','debit'), expCogs = !b.cost_reviewed ? 0 : bookingEffectiveCost(b);
    if(Math.abs(cogs-expCogs)>0.05) add(ar?'التكلفة في القيود لا تطابق التذكرة':'Cost entries ≠ ticket', expCogs, cogs);
  });
  profitHandovers.filter(h=>h.status==='approved' && Math.abs(Number(h.total_profit))>0.004).forEach(h=>{
    if(!journal.some(j=>j.desc_key==='jProfitHandover' && (j.desc_args||[])[1]===h.id))
      issues.push({b:null, issue: ar?`تسليم أرباح معتمد بدون قيد — ${userName(h.employee_id)} (${(h.created_at||'').slice(0,10)})`:`Approved profit handover without entry — ${userName(h.employee_id)}`, expected:+Number(h.total_profit).toFixed(2), actual:0});
  });
  miscReceipts.filter(r=>r.status==='confirmed').forEach(r=>{
    if(!miscReceiptJournalRow(r)) issues.push({b:null, issue: ar?`مبلغ بدون تذكرة معتمد بدون قيد — ${userName(r.employee_id)}`:`Confirmed misc receipt without entry — ${userName(r.employee_id)}`, expected:+Number(r.amount).toFixed(2), actual:0});
  });
  const orphans = journal.filter(j=>j.booking_id && !ids.has(j.booking_id));
  if(orphans.length) issues.push({b:null, issue: ar?`قيود مرتبطة بتذاكر محذوفة (${orphans.length})`:`Entries linked to deleted tickets (${orphans.length})`, expected:0, actual:+orphans.reduce((a,j)=>a+Number(j.amount||0),0).toFixed(2)});
  return issues;
}

/* Rebuild a ticket's automatic journal entries from the ticket itself (the ticket is the source of truth). */
async function repairBooking(bookingId){
  const ar = lang==='ar';
  let b = bookings.find(x=>x.id===bookingId);
  if(!b) throw new Error('booking not found');
  const notes = [];
  // 0) split parts must add up to the ticket price — the parts reflect the money actually received
  if(b.payment_method==='split' && Array.isArray(b.payment_splits)){
    const tot = +b.payment_splits.reduce((a,x)=>a+Number(x.amount||0),0).toFixed(2);
    if(Math.abs(tot-(Number(b.sell)||0))>0.004){
      const profit = +(tot-(Number(b.cost)||0)).toFixed(2);
      const {data:u, error} = await sb.from('bookings').update({sell:tot, profit_amount:profit, margin:profit, net_profit:profit}).eq('id', b.id).select().single();
      if(error) throw error;
      bookings[bookings.findIndex(x=>x.id===b.id)] = u; b = u;
      notes.push(ar?`سعر التذكرة صُحّح إلى مجموع أجزاء الدفع ${money(tot)}`:`Ticket price set to split total ${money(tot)}`);
    }
  }
  const rows = journal.filter(j=>j.booking_id===b.id);
  const delIds = [];
  const ins = [];
  const saleArgs = [b.booking_no, b.airline||'-', b.customer];
  // 1) sale rows
  rows.filter(j=>j.desc_key==='jSale').forEach(j=>delIds.push(j.id));
  if(b.payment_method==='split' && Array.isArray(b.payment_splits))
    b.payment_splits.forEach(x=>ins.push({date:b.date, branch_id:b.branch_id, booking_id:b.id, desc_key:'jSale', desc_args:saleArgs, debit_key: x.method==='cash'?'accCashOnHand':'accCustomers', credit_key:'accSalesRev', amount:+Number(x.amount||0).toFixed(2)}));
  else ins.push({date:b.date, branch_id:b.branch_id, booking_id:b.id, desc_key:'jSale', desc_args:saleArgs, debit_key: b.payment_method==='cash'?'accCashOnHand':'accCustomers', credit_key:'accSalesRev', amount:+(Number(b.sell)||0).toFixed(2)});
  // 2) cost row
  rows.filter(j=>j.desc_key==='jCost').forEach(j=>delIds.push(j.id));
  if(b.cost_reviewed && Number(b.cost)>0) ins.push({date:b.date, branch_id:b.branch_id, booking_id:b.id, desc_key:'jCost', desc_args:[b.booking_no, b.airline||'-'], debit_key:'accCogs', credit_key:'accSuppliers', amount:+Number(b.cost).toFixed(2)});
  // 3) duplicate bank receipts / card fees
  const receipts = rows.filter(j=>j.desc_key==='jBankReceipt').sort((x,y)=>(x.created_at||'').localeCompare(y.created_at||''));
  const fees = rows.filter(j=>j.desc_key==='jCardFee').sort((x,y)=>(x.created_at||'').localeCompare(y.created_at||''));
  const feeRateOf = m=> m==='span'?0.008 : m==='installment'?0.07 : 0;
  let expReceipts = [], expFees = [];
  if(b.payment_method==='split' && Array.isArray(b.payment_splits)){
    b.payment_splits.filter(x=>x.method!=='cash' && x.verified).forEach(x=>{
      const amt = x.verified_amount!=null ? Number(x.verified_amount) : Number(x.amount)||0;
      const fee = +(amt*feeRateOf(x.method)).toFixed(2);
      expReceipts.push(+(amt-fee).toFixed(2)); if(fee>0) expFees.push(fee);
    });
  }
  const keepMatching = (list, expected, keepFirstN)=>{
    const used = new Set();
    if(keepFirstN!=null){ list.forEach((j,k)=>{ if(k>=keepFirstN) delIds.push(j.id); }); return list.length>keepFirstN; }
    expected.forEach(a=>{ const hit = list.find(j=>!used.has(j.id) && Math.abs(Number(j.amount)-a)<0.02); if(hit) used.add(hit.id); });
    let removed = false;
    list.forEach(j=>{ if(!used.has(j.id)){ delIds.push(j.id); removed = true; } });
    return removed;
  };
  let removed = false;
  if(b.payment_method==='split') removed = keepMatching(receipts, expReceipts) | keepMatching(fees, expFees);
  else if(b.payment_method==='cash') removed = keepMatching(receipts, [], 0) | keepMatching(fees, [], 0);
  else {
    const dedupe = list=>{ const seen=new Set(); let r=false; list.forEach(j=>{ const k=(+Number(j.amount).toFixed(2)); if(seen.has(k)){ delIds.push(j.id); r=true; } else seen.add(k); }); return r; };
    removed = dedupe(receipts) | dedupe(fees);
  }
  if(removed) notes.push(ar?'حُذف قيد بنكي زائد':'Extra bank entry removed');
  // apply journal changes
  if(delIds.length){ const {error} = await sb.from('journal').delete().in('id', delIds); if(error) throw error; const d = new Set(delIds); journal = journal.filter(j=>!d.has(j.id)); }
  if(ins.length){ const {data, error} = await sb.from('journal').insert(ins).select(); if(error) throw error; journal.unshift(...data.reverse()); }
  // 4) status must follow the bank entry
  if(b.payment_method!=='cash' && b.payment_method!=='split'){
    const has = journal.some(j=>j.booking_id===b.id && j.desc_key==='jBankReceipt');
    if(has !== !!b.transfer_verified){
      const upd = has ? {transfer_verified:true, payment_status:'paid'} : {transfer_verified:false, payment_status:'pending'};
      const {error} = await sb.from('bookings').update(upd).eq('id', b.id); if(error) throw error;
      Object.assign(b, upd);
      notes.push(has ? (ar?'الحالة صُحّحت إلى مؤكَّد':'Status set to confirmed') : (ar?'الحالة رجعت "بانتظار التأكيد" ليؤكدها المحاسب من البنك':'Status reset to awaiting confirmation'));
    }
  }
  // 5) anything still off needs a human decision
  const left = integrityIssues().filter(x=>x.b && x.b.id===b.id);
  return {notes, left};
}
function integrityWarnings(){
  const ar = lang==='ar';
  const w = [];
  bookings.forEach(b=>{
    if(bookingIsFullRefund(b) || !b.cost_reviewed) return;
    const p = bookingProfitNow(b);
    if(p < -0.004) w.push({b, refundLoss: !!b.refunded, issue: b.refunded
      ? (ar?`خسارة ${money(-p)} بعد الاسترجاع — المرجّع للعميل أكثر مما رجّعه المورد + الربح (تأكد من المبلغين)`:`Loss ${money(-p)} after refund — check customer vs supplier refund`)
      : (ar?`تذكرة بخسارة ${money(-p)} (تأكد إن البيع والسستم فير مو معكوسين)`:`Loss ticket ${money(-p)} (check sell / fare not swapped)`), sell:b.sell, cost:b.cost});
    else if(Number(b.cost)===0) w.push({b, issue: ar?'تكلفة صفر — الربح يساوي كامل سعر البيع':'Zero cost — profit equals full price', sell:b.sell, cost:b.cost});
  });
  return w;
}

function openSupplierPaymentModal(){
  const unsettled = bookings.filter(b=>b.supplier && Number(b.cost)>0 && !b.supplier_settled && bookingNetSupplierCost(b)>0.004 && !(b.refunded && !bookingSupplierRefundKnown(b)));
  const suppliers = [...new Set(unsettled.map(b=>b.supplier))];
  showModal(`
    <div class="modal-head"><h3>${t('modalSupplierPay')}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    ${suppliers.length===0?`<div class="empty">${t('noUnsettledSupplier')}</div>`:`
    <div class="field"><label>${t('colSupplier')}</label><select id="supplierPaySel">
      ${suppliers.map(s=>`<option value="${s}">${s}</option>`).join('')}
    </select></div>

      <div class="field"><label>${lang==='ar'?'الفاتورة حتى تاريخ':'Invoice up to date'}</label><input type="date" id="supplierPayTo"></div>
      <div class="field"><label>${lang==='ar'?'مبلغ فاتورة المورد (اختياري)':'Supplier invoice amount (optional)'}</label><input type="number" step="0.01" id="supplierInvoiceAmt"></div>
    </div>
    <div class="field"><label>${lang==='ar'?'مصدر السداد':'Paid from'}</label><select id="supplierPayVia">
      <option value="bank">${lang==='ar'?'تحويل من حساب البنك':'Bank transfer'}</option>
      <option value="deposit">${lang==='ar'?'من الإيداعات المباشرة للمورد (مدفوعة مسبقًا)':'From direct deposits to the supplier (already paid)'}</option>
    </select><div class="note" id="supplierViaNote"></div></div>
    <div id="supplierPayListBox" style="margin-top:10px;"></div>
    <div id="supplierPayErrorBox"></div>
    <div style="margin-top:16px;display:flex;gap:10px;">
      <button class="btn btn-primary" id="supplierPaySubmitBtn" disabled>${t('registerPaymentBtn')}</button>
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
    </div>`}
  `);
  if(suppliers.length===0) return;
  const renderList = (supplierName)=>{
    const toD = document.getElementById('supplierPayTo').value;
    const list = unsettled.filter(b=>b.supplier===supplierName && (!toD || (b.date||'')<=toD)).sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.created_at||'').localeCompare(a.created_at||''));
    const box = document.getElementById('supplierPayListBox');
    box.innerHTML = `<div style="overflow-x:auto;"><table><thead><tr><th><input type="checkbox" id="supPayAll" style="width:auto;" title="${lang==='ar'?'تحديد الكل':'Select all'}"></th><th>${t('colNo')}</th><th>${t('jDate')}</th><th>${t('colCustomer')}</th><th>${t('colTicketNo')}</th><th>${t('colAmount')}</th></tr></thead>
      <tbody>${list.map(b=>`<tr><td><input type="checkbox" class="supPayChk" data-id="${b.id}" data-amt="${bookingNetSupplierCost(b)}" style="width:auto;"></td>
        <td class="num">${b.booking_no}</td><td>${b.date}</td><td>${esc(b.customer)}</td><td>${esc(b.ticket_no||'—')}</td><td class="num">${money(bookingNetSupplierCost(b))}${b.refunded?`<div style="font-size:11px;color:#A8722C;">${lang==='ar'?'بعد مسترد المورد':'after supplier refund'}</div>`:''}</td></tr>`).join('')}</tbody></table></div>
      <div style="margin-top:10px;font-weight:700;">${t('selectedTotalLabel')}: <span id="supplierPayTotal">${money(0)}</span></div>
      <div id="supplierPayDiff" style="margin-top:4px;font-size:13px;"></div>`;
    const update = ()=>{
      const checked = [...box.querySelectorAll('.supPayChk:checked')];
      const total = +checked.reduce((s,c)=>s+Number(c.dataset.amt||0),0).toFixed(2);
      document.getElementById('supplierPayTotal').textContent = money(total);
      document.getElementById('supplierPaySubmitBtn').disabled = checked.length===0;
      const inv = document.getElementById('supplierInvoiceAmt').value;
      const diffBox = document.getElementById('supplierPayDiff');
      if(inv===''){ diffBox.innerHTML=''; return; }
      const diff = +(Number(inv) - total).toFixed(2);
      diffBox.innerHTML = Math.abs(diff)<0.01
        ? `<span style="color:#1f7a4d;">✔ ${lang==='ar'?'المحدد مطابق لفاتورة المورد':'Selection matches the supplier invoice'}</span>`
        : `<span style="color:#b3261e;">⚠ ${lang==='ar'?'فرق عن فاتورة المورد':'Difference vs supplier invoice'}: ${money(diff)} — ${lang==='ar'?(diff>0?'الفاتورة أعلى: فيه تذاكر عند المورد غير مسجلة أو بتكلفة أقل بالنظام':'الفاتورة أقل: فيه تذاكر محددة ما فوترها المورد أو تكلفتها أعلى بالنظام'):(diff>0?'invoice higher':'invoice lower')}</span>`;
    };
    box.querySelectorAll('.supPayChk').forEach(chk=>{ chk.onchange = update; });
    document.getElementById('supPayAll').onchange = (e)=>{ box.querySelectorAll('.supPayChk').forEach(c=>c.checked=e.target.checked); update(); };
    document.getElementById('supplierInvoiceAmt').oninput = update;
    update();
  };
  renderList(suppliers[0]);
  const viaNote = ()=>{ const n = document.getElementById('supplierPaySel').value; const c = supplierDepositCredit(n);
    document.getElementById('supplierViaNote').innerHTML = c.paid>0 ? (lang==='ar'?`إيداعات مباشرة لـ ${esc(n)}: ${money(c.paid)} — مستخدم ${money(c.used)} — متاح ${money(c.available)}`:`Direct deposits to ${esc(n)}: ${money(c.paid)} — used ${money(c.used)} — available ${money(c.available)}`) : ''; };
  document.getElementById('supplierPaySel').onchange = (e)=>{ renderList(e.target.value); viaNote(); };
  viaNote();
  document.getElementById('supplierPayTo').onchange = ()=>renderList(document.getElementById('supplierPaySel').value);
  document.getElementById('supplierPaySubmitBtn').onclick = async ()=>{
    const btn = document.getElementById('supplierPaySubmitBtn'); btn.disabled=true; btn.textContent=t('saving');
    const ids = [...document.querySelectorAll('.supPayChk:checked')].map(c=>c.dataset.id);
    const via = document.getElementById('supplierPayVia').value;
    if(via==='deposit'){
      const sel = bookings.filter(b=>ids.includes(b.id)); const tot = sel.reduce((a,b)=>a+Number(b.cost||0),0);
      const av = supplierDepositCredit(document.getElementById('supplierPaySel').value).available;
      if(tot > av + 0.01 && !confirm(lang==='ar'?`المحدد ${money(tot)} أكبر من الإيداعات المتاحة للمورد ${money(av)}. متابعة؟`:`Selected ${money(tot)} exceeds available deposits ${money(av)}. Continue?`)){ btn.disabled=false; btn.textContent=t('registerPaymentBtn'); return; }
    }
    try{ await settleSupplierBulk(ids, via); closeModal(); render(); }
    catch(err){ console.error(err); document.getElementById('supplierPayErrorBox').innerHTML = `<div class="login-error">${errText()}</div>`; btn.disabled=false; btn.textContent=t('registerPaymentBtn'); }
  };
}

    (reportEmployeeFilter==='all' || b.created_by===reportEmployeeFilter) &&

function setReportQuickRange(kind){
  const today = todayStr();

  if(kind==='month') from = today.slice(0,8)+'01';
  else if(kind==='year') from = today.slice(0,4)+'-01-01';
  reportDateFrom = from; reportDateTo = today;
  renderReports();
}

function renderTransfers(){
  document.getElementById('pageSub').textContent = t('subTransfers');
  const scopedBookings = filteredBookings();
  const pendingTransfers = scopedBookings.filter(b=>b.payment_method!=='cash' && b.payment_method!=='split' && transferParts(b).some(p=>p.status==='pending'));
  const verifiedTransfers = scopedBookings.filter(b=>(b.payment_method==='transfer'||b.payment_method==='span'||b.payment_method==='installment') && b.transfer_verified);
  const pendingSplitRows = [];
  scopedBookings.filter(b=>b.payment_method==='split' && Array.isArray(b.payment_splits)).forEach(b=>{
    transferParts(b).forEach(p=>{ if(p.status==='pending') pendingSplitRows.push({b, s:b.payment_splits[p.part], i:p.part}); });
  });
  let html = `<div class="panel"><div class="panel-head"><h3 class="panel-title">${t('pendingVerifyTitle')}</h3></div>
      ${pendingTransfers.length===0?`<div class="empty">${t('noPendingTransfers')}</div>`:`<div style="overflow-x:auto;"><table><thead><tr><th>${t('colNo')}</th><th>${t('colCustomer')}</th><th>${t('colEmployee')}</th><th>${t('colBranch')}</th><th>${t('colPaymentMethod')}</th><th>${t('fieldBankName')}</th><th>${t('colAmount')}</th><th>${t('colFee')}</th><th></th></tr></thead>
      <tbody>${pendingTransfers.map(b=>`<tr><td class="num">${b.booking_no}</td><td>${esc(b.customer)}</td><td>${userName(b.created_by)}</td><td>${branchName(b.branch_id)}</td>
        <td>${b.payment_method==='span'?t('paySpan'):b.payment_method==='installment'?t('payInstallment'):t('payTransfer')}</td>
        <td>${b.payment_method==='span'?'—':bankLabel(b.bank_name)}</td>
        <td class="num">${money(bookingPendingAmount(b))}${b.refunded?`<div style="font-size:11px;color:#A8722C;">${lang==='ar'?'بعد استرجاع جزئي':'after partial refund'}</div>`:''}</td>
        <td class="num">${b.payment_method==='span'?money(+(bookingPendingAmount(b)*0.008).toFixed(2)):b.payment_method==='installment'?money(+(bookingPendingAmount(b)*0.07).toFixed(2)):'—'}</td>
        <td style="display:flex;gap:6px;"><button class="btn btn-primary btn-sm" onclick="uiVerifyTransfer('${b.id}')">${t('verifyTransferBtn')}</button><button class="btn btn-danger btn-sm" onclick="uiRejectTransfer('${b.id}')">${t('rejectTransferBtn')}</button></td></tr>`).join('')}</tbody></table></div>`}
    </div>
    <div class="panel"><div class="panel-head"><h3 class="panel-title">${t('pendingSplitTitle')}</h3></div>
      <p class="note">${t('pendingSplitNote')}</p>
      ${pendingSplitRows.length===0?`<div class="empty">${t('noPendingTransfers')}</div>`:`<div style="overflow-x:auto;"><table><thead><tr><th>${t('colNo')}</th><th>${t('colCustomer')}</th><th>${t('colEmployee')}</th><th>${t('colBranch')}</th><th>${t('colPaymentMethod')}</th><th>${t('fieldBankName')}</th><th>${t('colAmount')}</th><th>${t('originalAmountLabel')}</th><th></th></tr></thead>
      <tbody>${pendingSplitRows.map(({b,s,i})=>`<tr><td class="num">${b.booking_no}</td><td>${esc(b.customer)}</td><td>${userName(b.created_by)}</td><td>${branchName(b.branch_id)}</td>
        <td>${s.method==='span'?t('paySpan'):s.method==='installment'?t('payInstallment'):t('payTransfer')}</td>
        <td>${s.method==='span'?'—':bankLabel(s.bankName)}</td>
        <td class="num" style="font-weight:600">${money((transferParts(b).find(p=>p.part===i)||{}).counted ?? s.amount)}${b.refunded?`<div style="font-size:11px;color:#A8722C;">${lang==='ar'?'بعد استرجاع جزئي':'after partial refund'}</div>`:''}</td>
        <td class="num">${money(b.sell)}</td>
        <td><button class="btn btn-primary btn-sm" onclick="uiVerifySplitPayment('${b.id}', ${i})">${t('verifyTransferBtn')}</button></td></tr>`).join('')}</tbody></table></div>`}
    </div>
    <div class="panel"><div class="panel-head"><h3 class="panel-title">${t('verifiedTransfersTitle')}</h3></div>
      ${verifiedTransfers.length===0?`<div class="empty">${t('noVerifiedTransfers')}</div>`:`<div style="overflow-x:auto;"><table><thead><tr><th>${t('colNo')}</th><th>${t('colCustomer')}</th><th>${t('colEmployee')}</th><th>${t('colBranch')}</th><th>${t('colPaymentMethod')}</th><th>${t('fieldBankName')}</th><th>${t('colAmount')}</th></tr></thead>
      <tbody>${verifiedTransfers.slice(0,50).map(b=>`<tr><td class="num">${b.booking_no}</td><td>${esc(b.customer)}</td><td>${userName(b.created_by)}</td><td>${branchName(b.branch_id)}</td>
        <td>${b.payment_method==='span'?t('paySpan'):b.payment_method==='installment'?t('payInstallment'):t('payTransfer')}</td>
        <td>${b.payment_method==='span'?'—':bankLabel(b.bank_name)}</td>
        <td class="num">${money(b.sell)}</td></tr>`).join('')}</tbody></table></div>`}
    </div>`;
  document.getElementById('content').innerHTML = html;

function renderDeposits(){

  let html = '';

    const bal = employeeCashOnHand(u.id);

      <div class="kpi-label">${t('myPersonalCash')}</div><div class="kpi-value">${money(bal)}</div></div></div>`;
  }else{
    const rows = branches.map(b=>({name:b.name, bal:branchCashOnHand(b.id)}));

      ${rows.length===0?`<div class="empty">${t('emptyBranches')}</div>`:`<table><thead><tr><th>${t('colBranchName')}</th><th>${t('colAmount')}</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="num" style="font-weight:600">${money(r.bal)}</td></tr>`).join('')}</tbody></table>`}

      ${employeeCashBreakdownHTML()}
    </div>`;
  }
  const myDeposits0 = canManage ? deposits : deposits.filter(d=>d.submitted_by===u.id);
  const myDeposits = canManage ? myDeposits0.filter(d=>(effectiveBranchFilter()==='all'||d.branch_id===effectiveBranchFilter()) && (employeeFilter==='all'||d.submitted_by===employeeFilter)) : myDeposits0;
  const pendingDeposits = myDeposits.filter(d=>d.status==='pending');

    ${depositsTableHTML(historyDeposits, false)}
  </div>`;
  const myMisc0 = canManage ? miscReceipts : miscReceipts.filter(r=>r.employee_id===u.id);
  const myMisc = canManage ? myMisc0.filter(r=>(effectiveBranchFilter()==='all'||r.branch_id===effectiveBranchFilter()) && (employeeFilter==='all'||r.employee_id===employeeFilter)) : myMisc0;
  const pendingMisc = myMisc.filter(r=>r.status==='pending');
  const historyMisc = myMisc.filter(r=>r.status!=='pending');
  html += `<div class="panel"><div class="panel-head"><h3 class="panel-title">${t('miscReceiptsTitle')}</h3><button class="btn btn-primary btn-sm" id="addMiscReceiptBtn">${t('addMiscReceiptBtn')}</button></div>

    ${miscReceiptsTableHTML(historyMisc, false, canManage)}

  document.getElementById('content').innerHTML = html;

  document.getElementById('addMiscReceiptBtn').onclick = openMiscReceiptModal;
}
function miscReceiptsTableHTML(list, showApprove, canCancel){
  const withActions = showApprove || canCancel;
  if(list.length===0) return `<div class="empty">${t('emptyData')}</div>`;
  return `<div style="overflow-x:auto;"><table><thead><tr><th>${t('jDate')}</th><th>${t('colEmployee')}</th><th>${t('colBranch')}</th><th>${t('fieldPaymentMethod')}</th><th>${t('colAmount')}</th><th>${t('fieldChargeReason')}</th><th>${t('colDepositStatus')}</th>${withActions?'<th></th>':''}</tr></thead>
    <tbody>${list.map(r=>`<tr style="${r.status==='cancelled'?'opacity:.55;':''}"><td>${(r.created_at||'').slice(0,10)}</td><td>${esc(userName(r.employee_id))}</td><td>${branchName(r.branch_id)}</td>
      <td>${r.method==='cash'?t('payCash'):r.method==='span'?t('paySpan'):t('payTransfer')}${r.bank_name?` (${bankLabel(r.bank_name)})`:''}</td>
      <td class="num" style="font-weight:600">${money(r.amount)}</td><td>${esc(r.note||'—')}</td>
      <td><span class="tag ${r.status==='confirmed'?'collected':(r.status==='rejected'||r.status==='cancelled')?'rejected':'pending'}">${r.status==='confirmed'?t('depositApproved'):r.status==='rejected'?t('depositRejected'):r.status==='cancelled'?(lang==='ar'?'ملغي':'Cancelled'):t('depositPending')}</span>

window.uiApproveRefund = function(id){
  const b = bookings.find(x=>x.id===id);
  if(!b) return;
  const isTransfer = b.refund_method==='transfer';
  showModal(`
    <div class="modal-head"><h3>${t('modalApproveRefund')}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <p class="note">${t('colNo')}: ${b.booking_no} — ${esc(b.customer)}</p>
    ${canSeeSalesTotals()?`<p class="note">${t('originalAmountLabel')}: ${money(b.sell)} — ${t('fieldRefundAmount')}: <strong>${money(b.refund_amount!=null?b.refund_amount:b.sell)}</strong></p>`:''}
    <p class="note">${t('fieldRefundMethod')}: <strong>${isTransfer?t('payTransfer'):t('payCash')}</strong></p>
    <form id="approveRefundForm">
      <div class="field"><label>${lang==='ar'?'المسترد من المورد':'Supplier refund'} (${lang==='ar'?'التكلفة':'cost'}: ${money(b.cost)})</label><input type="number" step="0.01" min="0" max="${b.cost}" name="supplierRefund" id="apSupRef" value="${b.supplier_refund_amount!=null?b.supplier_refund_amount:''}" placeholder="${lang==='ar'?'فاضي = ما نعرفه بعد (يُسجَّل لاحقًا)':'Empty = not known yet'}"></div>
      <div class="note" id="apRefProfit"></div>
      ${isTransfer?`<div class="field"><label>${t('fieldRefundProof')}</label><input type="file" name="refundProof" accept="image/*" required></div>`:''}
      <div id="approveRefundErrorBox"></div>
      <div style="margin-top:16px;display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary" id="approveRefundBtn">${t('approve')}</button>
        <button type="button" class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      </div>
    </form>`);
  const _apCalc = ()=>{
    const v = document.getElementById('apSupRef').value; const box = document.getElementById('apRefProfit');
    const cust = Number(b.refund_amount!=null?b.refund_amount:b.sell)||0;
    if(v===''){ box.innerHTML = lang==='ar'?'⏳ مسترد المورد غير معروف — التذكرة بتظهر في "بانتظار تسجيل مسترد المورد" لين تسجله.':'Supplier refund unknown — record it later.'; return; }
    const p = +(((Number(b.sell)||0)-cust) - ((Number(b.cost)||0)-Number(v))).toFixed(2);
    box.innerHTML = `${lang==='ar'?'ربح التذكرة بعد الاسترجاع':'Ticket profit after refund'}: <b style="color:${p<0?'var(--red)':'#1f7a4d'}">${money(p)}</b>`;
  };
  document.getElementById('apSupRef').oninput = _apCalc; _apCalc();
  document.getElementById('approveRefundForm').onsubmit = async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('approveRefundBtn');
    const f = new FormData(e.target);
    const file = f.get('refundProof');
    if(isTransfer && (!file || !file.size)){
      document.getElementById('approveRefundErrorBox').innerHTML = `<div class="login-error">${t('refundProofRequired')}</div>`;
      return;
    }
    btn.disabled=true; btn.textContent=t('saving');
    try{
      const proofUrl = isTransfer ? await uploadReceiptFile(file) : null;
      const sv = document.getElementById('apSupRef').value;
      const supVal = sv==='' ? null : +Number(sv).toFixed(2);
      if(supVal!=null && (supVal<0 || supVal>(Number(b.cost)||0)+0.01)) throw new Error(lang==='ar'?'مسترد المورد لازم يكون بين 0 والتكلفة.':'Supplier refund must be between 0 and the cost.');
      if(supVal!==(b.supplier_refund_amount??null)){ const {error:eS} = await sb.from('bookings').update({supplier_refund_amount:supVal}).eq('id', id); if(eS) throw eS; b.supplier_refund_amount = supVal; }
      await approveRefund(id, b.refund_method, proofUrl);
      closeModal(); render();
    }catch(err){
      console.error(err);
      document.getElementById('approveRefundErrorBox').innerHTML = `<div class="login-error">${errText()}</div>`;
      btn.disabled=false; btn.textContent=t('approve');
    }
  };
};

window.uiRepairBooking = async function(id){
  const b = bookings.find(x=>x.id===id); if(!b) return;
  const ar = lang==='ar';
  if(!confirm(ar ? `إصلاح قيود التذكرة #${b.booking_no} (${b.customer||''})؟\n\nسيُعاد بناء قيود المبيعات والتكلفة من بيانات التذكرة نفسها، ويُحذف أي قيد بنكي مكرر، وتُضبط حالة التأكيد حسب قيد البنك.\nالتذكرة: ${money(b.sell)} — ${b.payment_method}`
                 : `Rebuild entries of ticket #${b.booking_no} from the ticket data?`)) return;
  try{
    let r = await repairBooking(id);
    const bb = bookings.find(x=>x.id===id);
    const gross = bookingConfirmedGross(id);
    if(r.left.length && bb && bb.payment_method!=='cash' && bb.payment_method!=='split' && bb.transfer_verified && gross>0 && Math.abs(gross-(Number(bb.sell)||0))>0.01){
      if(confirm(ar ? `المبلغ المستلم فعليًا في البنك للتذكرة #${bb.booking_no} هو ${money(gross)}، بينما سعر البيع المسجل ${money(bb.sell)}.\n\nهل سعر البيع الصحيح هو ${money(gross)}؟`
                    : `Bank received ${money(gross)} but the ticket price is ${money(bb.sell)}. Is the correct price ${money(gross)}?`)){
        const c = prompt(ar ? `التكلفة (السستم فير) الصحيحة للتذكرة #${bb.booking_no}:` : 'Correct cost (system fare):', String(bb.cost));
        if(c===null) return;
        const cost = +Number(c).toFixed(2); if(isNaN(cost)) return;
        const profit = +(gross-cost).toFixed(2);
        const {data:u, error} = await sb.from('bookings').update({sell:gross, cost, profit_amount:profit, margin:profit, net_profit:profit, cost_reviewed:true}).eq('id', id).select().single();
        if(error) throw error;
        bookings[bookings.findIndex(x=>x.id===id)] = u;
        r = await repairBooking(id);
        r.notes.unshift(ar ? `سعر البيع صار ${money(gross)} والتكلفة ${money(cost)} (الربح ${money(profit)})` : `Price ${money(gross)}, cost ${money(cost)}`);
      }
    }
    let msg = r.notes.length ? r.notes.join('\n') : (ar?'أُعيد بناء القيود.':'Entries rebuilt.');
    if(r.left.length) msg += '\n\n' + (ar?'⚠️ باقي يحتاج قرارك:\n':'⚠️ Still needs a decision:\n') + r.left.map(x=>`${x.issue}: ${ar?'المفروض':'expected'} ${money(x.expected)} / ${ar?'الموجود':'actual'} ${money(x.actual)}`).join('\n')
      + (ar?'\n\n(غالبًا المبلغ المستلم في البنك يختلف عن سعر التذكرة — تواصل معي بالصورة)':'');
    else msg += '\n\n✔ ' + (ar?'التذكرة سليمة الآن.':'Ticket is now consistent.');
    alert(msg);
    openIntegrityModal();
  }catch(e){ console.error(e); alert(errTextPlain()); }
};
/* Correct a ticket's sale price / cost (admin) and rebuild its entries */
function suggestTicketFix(b){
  const sell = Number(b.sell)||0, cost = Number(b.cost)||0;
  const gross = bookingConfirmedGross(b.id);
  if(b.payment_method!=='cash' && b.payment_method!=='split' && gross>0) return {sell:gross, cost, why: lang==='ar'?'المبلغ اللي وصل البنك فعلًا':'amount actually received in bank'};
  if(sell < cost*0.5) return {sell:+(cost+sell).toFixed(2), cost, why: lang==='ar'?`يبدو إن الموظف كتب الربح (${money(sell)}) مكان سعر البيع`:'profit seems typed as price'};
  if(sell < cost) return {sell:cost, cost:sell, why: lang==='ar'?'يبدو إن البيع والسستم فير معكوسين':'sell and fare seem swapped'};
  return {sell, cost, why:''};
}
async function fixTicketPrice(id, newSell, newCost){
  const b = bookings.find(x=>x.id===id); if(!b) throw new Error('booking not found');
  newSell = requirePositive(newSell); newCost = +Number(newCost).toFixed(2);
  if(!(newCost>=0)) throw new Error(lang==='ar'?'التكلفة غير صحيحة.':'Invalid cost.');
  if(b.payment_method==='split') throw new Error(lang==='ar'?'تذكرة دفع متعدد: عدّل أجزاء الدفع من شاشة التذكرة.':'Split ticket: edit it from the ticket screen.');
  if(b.supplier_settled && Math.abs(newCost-(Number(b.cost)||0))>0.004) throw new Error(lang==='ar'?'تم سداد المورد لهذه التذكرة — لا يمكن تغيير التكلفة.':'Supplier already paid — cost cannot change.');
  const gross = bookingConfirmedGross(id);
  if(b.payment_method!=='cash' && gross>0 && Math.abs(newSell-gross)>0.01)
    throw new Error(lang==='ar'?`التحويل مؤكد في البنك بمبلغ ${money(gross)} — سعر البيع لازم يساويه.`:`Transfer confirmed at ${money(gross)} — price must match.`);
  const profit = +(newSell-newCost).toFixed(2);
  const {data:u, error} = await sb.from('bookings').update({sell:newSell, cost:newCost, profit_amount:profit, margin:profit, net_profit:profit, cost_reviewed:true}).eq('id', id).select().single();
  if(error) throw error;
  bookings[bookings.findIndex(x=>x.id===id)] = u;
  return await repairBooking(id);
}

/* ---- robust parsing for statements coming from GDS / suppliers / banks ---- */
function parseAmount(v){
  if(v===null || v===undefined) return NaN;
  if(typeof v==='number') return v;
  let t0 = String(v).trim();
  if(!t0) return NaN;
  t0 = t0.replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,',');
  let neg = /^\(.*\)$/.test(t0) || /-\s*$/.test(t0) || /^-/.test(t0.replace(/[^0-9\-.,]/g,''));
  t0 = t0.replace(/[^0-9.,]/g,'');
  if(!/[0-9]/.test(t0)) return NaN;
  if(t0.includes(',') && t0.includes('.')) t0 = t0.lastIndexOf(',') > t0.lastIndexOf('.') ? t0.replace(/\./g,'').replace(',', '.') : t0.replace(/,/g,'');
  else if(t0.includes(',')) t0 = /,\d{1,2}$/.test(t0) ? t0.replace(',', '.') : t0.replace(/,/g,'');
  const n = Number(t0);
  return isNaN(n) ? NaN : (neg ? -n : n);
}
function supplierUserToEmployee(val){
  const x = String(val??'').toUpperCase().replace(/\s+/g,' ').trim();
  if(!x) return null;
  let best = null, bestLen = 0;
  users.forEach(u=>{
    String(u.supplier_aliases||'').split(',').map(a=>a.trim().toUpperCase().replace(/\s+/g,' ')).filter(a=>a.length>=3).forEach(a=>{
      if((x===a || x.includes(a) || (a.length>=6 && a.includes(x) && x.length>=4)) && a.length>bestLen){ best = u; bestLen = a.length; }
    });
  });
  return best;
}
function normTicket(v){ return String(v??'').toUpperCase().replace(/[\s\-\/\.]/g,''); }
/* every key a ticket value can be recognised by: full text, each part of a multi-ticket cell, digits, last 10 digits */
function ticketKeys(v){
  const out = new Set();
  let raw = v;
  if(typeof raw==='number' && Number.isFinite(raw)) raw = BigInt(Math.round(raw)).toString();
  const str = String(raw??'').trim();
  if(!str) return out;
  const parts = [str, ...str.split(/[\s,;|\/:]+/)];
  parts.forEach(p=>{
    const n = normTicket(p); if(n.length>=5) out.add('T:'+n);
    const d = String(p).replace(/[^0-9]/g,'');
    if(d.length>=6) out.add('D:'+d.replace(/^0+/,''));
    if(d.length>=10) out.add('L:'+d.slice(-10));
  });
  return out;
}
function normName(v){ return String(v??'').toUpperCase().replace(/\b(MR|MRS|MS|MISS|MSTR|CHD|INF)\b/g,' ').replace(/[^A-Z\u0600-\u06FF ]/g,' ').split(/\s+/).filter(w=>w.length>1); }
function namesMatch(a, b){
  const A = normName(a), B = normName(b);
  if(!A.length || !B.length) return false;
  const ca = A.join(''), cb = B.join('');
  if(ca.length>=6 && cb.length>=6 && (ca.includes(cb) || cb.includes(ca))) return true;
  const [small, big] = A.length<=B.length ? [A,B] : [B,A];
  const hits = small.filter(w=>big.includes(w)).length;
  return hits===small.length || (hits>=2 && hits>=small.length-1);
}

      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        // read EVERY sheet; in each, the header is the row (within the first 20) with the most text cells
        let rows = [], headerSet = [], sheetsUsed = 0;
        wb.SheetNames.forEach(name=>{
          const ws = wb.Sheets[name];
          try{
            let maxR = 0, maxC = 0, any = false;
            Object.keys(ws).forEach(k=>{ if(k[0]==='!') return; const c = XLSX.utils.decode_cell(k); any = true; if(c.r>maxR) maxR=c.r; if(c.c>maxC) maxC=c.c; });
            if(any) ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:maxR, c:maxC}});
          }catch(e){}
          const grid = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
          if(!grid.length) return;
          let headerRowIdx = 0, best = -1;
          grid.slice(0,20).forEach((r,i)=>{
            const textCells = r.filter(c=> typeof c==='string' && c.trim()!=='' && isNaN(parseAmount(c))).length;
            const filled = r.filter(c=> String(c).trim()!=='').length;
            const score = textCells*2 + filled;
            if(filled>=2 && score>best){ best = score; headerRowIdx = i; }
          });
          const used = {};
          const headerRow = (grid[headerRowIdx]||[]).map((h,i)=>{ let n = String(h).trim()!=='' ? String(h).trim().replace(/\s+/g,' ') : `COL_${i+1}`; if(used[n]){ used[n]++; n = `${n} (${used[n]})`; } else used[n]=1; return n; });
          const width = Math.max(headerRow.length, ...grid.map(r=>r.length));
          for(let i=headerRow.length;i<width;i++) headerRow.push(`COL_${i+1}`);
          const dataRows = grid.slice(headerRowIdx+1).filter(r=> r.some(c=>String(c).trim()!==''));
          if(!dataRows.length) return;
          sheetsUsed++;
          dataRows.forEach(r=>{ const obj = {}; headerRow.forEach((h,i)=>{ obj[h] = r[i]!==undefined ? r[i] : ''; }); rows.push(obj); });
          headerRow.forEach(h=>{ if(!headerSet.includes(h)) headerSet.push(h); });
        });
        if(rows.length===0){ alert(t('reconcileEmptyFile')); return; }
        reconcileRows = rows;

        document.getElementById('reconcileBankAmountColSel').innerHTML = opts;

          <div style="overflow-x:auto;margin-top:6px;"><table><thead><tr>${prevCols.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>

      }catch(err){ console.error(err); alert(t('reconcileParseError')); }
    };

  };

      ${(missing._notInFile||[]).length?`<div class="note" style="color:var(--red);font-weight:600;margin-top:10px;">⚠️ ${lang==='ar'?`تذاكر في النظام وما لقيناها في الملف (${missing._notInFile.length}) — حسب الفلاتر فوق (المورد/الفرع/الموظف/التاريخ)`:`Tickets in the system but not in the file (${missing._notInFile.length})`}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;"><button class="btn btn-ghost btn-sm" id="reconcileExcelNotInFileBtn">${t('reconcileExcelMatched').replace(/.*/, lang==='ar'?'Excel — غير الموجودة في الملف':'Excel — not in file')}</button></div>
      <div style="overflow-x:auto;margin-bottom:16px;"><table><thead><tr><th>${t('colNo')}</th><th>${t('colTicketNo')}</th><th>${t('colCustomer')}</th><th>${t('colEmployee')}</th><th>${t('colSupplier')}</th><th>${lang==='ar'?'التاريخ':'Date'}</th><th>${lang==='ar'?'التكلفة':'Cost'}</th><th>${lang==='ar'?'البيع':'Sell'}</th></tr></thead>
        <tbody>${missing._notInFile.map(b=>`<tr><td class="num">${b.booking_no}</td><td style="font-weight:700;color:var(--red)">${esc(b.ticket_no)}</td><td>${esc(b.customer||'')}</td><td>${esc(userName(b.created_by))}</td><td>${esc(b.supplier||'—')}</td><td>${b.date}</td><td class="num">${money(b.cost)}</td><td class="num">${money(b.sell)}</td></tr>`).join('')}</tbody></table></div>`:''}

      ${matched>0?`<div style="margin-top:10px;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
          <button class="btn btn-ghost btn-sm" id="reconcilePrintMatchedBtn">${t('reconcilePrintMatched')}</button>
          <button class="btn btn-ghost btn-sm" id="reconcileExcelMatchedBtn">${t('reconcileExcelMatched')}</button>
        </div>
        <div style="overflow-x:auto;"><table><thead><tr><th>${t('colNo')}</th><th>${t('colTicketNo')}</th><th>${t('colCustomer')}</th><th>${t('colEmployee')}</th><th>${t('colBranch')}</th><th>${t('colAmount')}</th></tr></thead>
          <tbody>${(missing._matchedList||[]).map(b=>`<tr><td class="num">${b.booking_no}</td><td>${esc(b.ticket_no||'—')}</td><td>${esc(b.customer)}</td><td>${esc(userName(b.created_by))}</td><td>${branchName(b.branch_id)}</td><td class="num">${money(b.sell)}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>`:''}
      ${missing._emptyColWarning?'':(missing.length===0?(amountMismatches.length===0?`<div class="empty">${t('reconcileAllMatched')}</div>`:''):`
      <div class="note" style="color:var(--red);font-weight:600;margin-top:14px;">⚠️ ${t('reconcileMissingNote')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;">
        <button class="btn btn-ghost btn-sm" id="reconcilePrintMissingBtn">${t('reconcilePrintNotFound')}</button>
      </div>
      ${missing._userCol && Object.keys(missing._byEmp||{}).length ? `<div class="note" style="font-weight:700;margin:6px 0;">👤 ${lang==='ar'?'التذاكر غير المسجلة حسب الموظف (من عمود':'Unrecorded tickets by employee (column'} "${esc(missing._userCol)}")</div>
      <div style="overflow-x:auto;margin-bottom:10px;"><table><thead><tr><th>${t('colEmployee')}</th><th>${lang==='ar'?'عدد السطور':'Rows'}</th>${missing._hasAmt?`<th>${lang==='ar'?'المبلغ':'Amount'}</th>`:''}</tr></thead>
        <tbody>${Object.entries(missing._byEmp).sort((a,b)=>b[1].count-a[1].count).map(([n,e])=>`<tr><td style="font-weight:700;${n.startsWith('❓')?'color:#A8722C':''}">${esc(n)}</td><td class="num">${e.count}</td>${missing._hasAmt?`<td class="num">${money(+e.amount.toFixed(2))}</td>`:''}</tr>`).join('')}</tbody></table></div>
      ${Object.keys(missing._byEmp).some(n=>n.startsWith('❓'))?`<div class="note" style="color:#A8722C;">❓ ${lang==='ar'?'= اسم مستخدم عند المورد غير مربوط بموظف. أضفه في: المستخدمين ← تعديل الموظف ← "أسماء المستخدم عند الموردين".':'= supplier username not linked to an employee. Add it under Users → edit → supplier usernames.'}</div>`:''}`:''}
      <div style="overflow-x:auto;"><table><thead><tr>${missing._userCol?`<th>${t('colEmployee')}</th>`:''}<th>${esc(col)}</th>${otherCols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${missing.map(row=>`<tr>${missing._userCol?`<td style="font-weight:700">${esc(row.__emp||'—')}</td>`:''}<td style="font-weight:700;color:var(--red);">${esc(row[col])}</td>${otherCols.map(c=>`<td>${esc(row[c]??'')}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`)}`;
    if(document.getElementById('reconcileExcelNotInFileBtn')) document.getElementById('reconcileExcelNotInFileBtn').onclick = ()=>exportBookingsToExcel(missing._notInFile||[], 'manage');
    if(document.getElementById('reconcilePrintMatchedBtn')) document.getElementById('reconcilePrintMatchedBtn').onclick = ()=>printTicketDetails(missing._matchedList||[]);
    if(document.getElementById('reconcileExcelMatchedBtn')) document.getElementById('reconcileExcelMatchedBtn').onclick = ()=>exportBookingsToExcel(missing._matchedList||[], 'manage');
    if(document.getElementById('reconcilePrintMissingBtn')) document.getElementById('reconcilePrintMissingBtn').onclick = ()=>printGenericTable(t('reconcileMissingNote'), [col,...otherCols], missing.map(row=>[row[col], ...otherCols.map(c=>row[c])]));
  };
}

/* ===================== MODAL ===================== */
function openMyAccountModal(){
  const u = currentUser();
  showModal(`
    <div class="modal-head"><h3>${t('modalMyAccount')}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <form id="myAccountForm">
      <div class="field"><label>${t('fieldNewUsername')}</label><input name="newUsername" value="${esc(u.username)}" required></div>
      <div class="field"><label>${t('fieldCurrentPassword')}</label><input type="password" name="currentPassword" required></div>
      <div class="grid-2">
        <div class="field"><label>${t('fieldNewPassword')}</label><input type="password" name="newPassword"></div>
        <div class="field"><label>${t('fieldConfirmPassword')}</label><input type="password" name="confirmPassword"></div>
      </div>
      <div class="note">${t('leaveBlankNote')}</div>
      <div id="myAccountErrorBox"></div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:start;">
        <button type="submit" class="btn btn-primary" id="myAccountSaveBtn">${t('saveAccount')}</button>
        <button type="button" class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      </div>
    </form>`);
  document.getElementById('myAccountForm').onsubmit = async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('myAccountSaveBtn');
    const f = new FormData(e.target);
    const newPassword = f.get('newPassword')||'';
    const confirmPassword = f.get('confirmPassword')||'';
    if(newPassword !== confirmPassword){
      document.getElementById('myAccountErrorBox').innerHTML = `<div class="login-error">${t('passwordMismatch')}</div>`;
      return;
    }
    btn.disabled=true; btn.textContent=t('saving');
    try{
      const {data:ok, error} = await sb.rpc('update_own_account', {
        p_user_id: u.id, p_current_password: f.get('currentPassword'),
        p_new_username: f.get('newUsername'), p_new_password: newPassword
      });
      if(error){
        if(String(error.message||'').toLowerCase().includes('duplicate')){ document.getElementById('myAccountErrorBox').innerHTML = `<div class="login-error">${t('usernameTaken')}</div>`; btn.disabled=false; btn.textContent=t('saveAccount'); return; }
        throw error;
      }
      if(!ok){ document.getElementById('myAccountErrorBox').innerHTML = `<div class="login-error">${t('wrongCurrentPassword')}</div>`; btn.disabled=false; btn.textContent=t('saveAccount'); return; }
      const updatedUser = { ...u, username: f.get('newUsername') };
      setSession(updatedUser);
      const localUser = users.find(x=>x.id===u.id); if(localUser) localUser.username = f.get('newUsername');
      closeModal(); alert(t('accountUpdated')); render();
    }catch(err){
      console.error(err);
      document.getElementById('myAccountErrorBox').innerHTML = `<div class="login-error">${errText()}</div>`;
      btn.disabled=false; btn.textContent=t('saveAccount');
    }
  };
}
function showModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('overlay').classList.add('show'); }
function closeModal(){ document.getElementById('overlay').classList.remove('show'); const mEl=document.querySelector('#overlay .modal'); if(mEl) mEl.style.width=''; }
window.closeModal = closeModal;
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
